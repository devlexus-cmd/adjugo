<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Espace partenaire — Adjugo</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/vendor/lucide-1.20.0.min.js" integrity="sha384-vEpkK5oidsrH6UhRc6tAPlgJZ/qXFwumFY+Kx8vBSeZ7NBag809YZCSmxFYGe/pt"></script>
  <script src="/static/cotraitance-crypto.js" integrity="sha384-LfIUJUio5EOqmxaVvhatEuTAAt6Duzw/pZHbdBAxOSWQxagrKbYaeNFZxzjc8REs"></script>
  <script src="/static/redaction-partenaire.js" integrity="sha384-a3BQ5CRAqvM5N/hPEMkni8dSIvc/2YxRRPkFUoPmocI3uCl+FckaoEW302Jwsjlb"></script>
  <script src="/static/sources-publiques.js" integrity="sha384-/0soYF6qmMI5KHOb/uzkHBoYNeOr5+R784XFb0c0+HjUkhtEyVBgunl6Xo08Dok+"></script>
  <script src="/static/carnet-notes.js" integrity="sha384-rNhlyqrjhKIiqL/xGL3y8DNWtllOzsqPT/r0od3igtWeT9N+xqDolMztixTiIng6"></script>
  <style>
    .g-state { text-align:center; padding:80px 20px; color:var(--text-2,#6b7280); font-family:system-ui,sans-serif; }
    .g-banner { display:flex; gap:10px; align-items:center; padding:11px 14px; border-radius:10px; background:var(--accent-weak,#eef2ff); border:1px solid var(--accent,#3b5bdb); margin-bottom:14px; }
    .g-locked { opacity:.62; }
    .g-fact { display:grid; grid-template-columns:170px 1fr; gap:6px 14px; font-size:13.5px; margin-top:10px; }
    .g-fact dt { color:var(--text-2,#6b7280); font-weight:600; } .g-fact dd { margin:0; }
    .g-doc { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 13px; border:1px solid var(--border,#e6e8ec); border-radius:10px; margin-top:8px; background:var(--surface,#fff); }
    ul.g-list { margin:4px 0 0; padding-left:18px; } ul.g-list li { margin:2px 0; }
    .g-res { padding:12px 14px; border:1px solid var(--border,#e6e8ec); border-radius:11px; margin-top:10px; background:var(--surface,#fff); }
    /* Co-traitance v2 : compléments locaux (les composants partagés sont dans styles.css) */
    .g-sec { margin-top:14px; padding-top:12px; border-top:1px solid var(--hairline,#eef0f3); }
    .g-members { list-style:none; margin:6px 0 0; padding:0; }
    .g-members li { display:flex; gap:7px; align-items:center; flex-wrap:wrap; padding:5px 0; border-bottom:1px solid var(--hairline,#eef0f3); font-size:12.5px; }
    .g-lockwrap textarea[readonly] { background:var(--surface-2,#f6f7f9); color:var(--text-2,#6b7280); cursor:not-allowed; }
    .g-piece-meta { display:flex; gap:6px 10px; align-items:center; flex-wrap:wrap; margin-top:6px; }
    .g-piece-meta .inp { height:30px; padding:0 8px; font-size:12px; width:auto; }
    .g-link { background:none; border:0; padding:0; color:var(--text-2,#6b7280); font-size:12px; text-decoration:underline; cursor:pointer; font-family:inherit; }
    .g-link:hover { color:var(--text,#16181d); }
    .g-banner:empty { display:none; }   /* bandeau réutilisé par plusieurs messages : pas de cadre vide */
    /* Ici lucide REMPLACE le <i> par un <svg class="lucide"> : on recale la taille de l'icône (i). */
    .tip > svg.lucide { width:15px; height:15px; }
    .g-chk { display:flex; gap:6px; align-items:center; }
    /* Aperçu minimal d'une invitation du réseau Adjugo (vague 3) */
    .g-apercu { margin-top:12px; padding:12px 14px; border-radius:10px; border:1px solid var(--accent,#3b5bdb); background:var(--accent-weak,#eef2ff); display:flex; flex-wrap:wrap; gap:10px 12px; align-items:center; }
    .g-apercu-t { display:flex; align-items:center; gap:6px; flex:1 1 200px; min-width:0; font-size:13.5px; }
    .g-apercu-a { display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
    .g-apercu-a .btn svg.lucide { width:14px; height:14px; margin-right:4px; }
    .g-apercu-msg { flex:1 1 100%; color:var(--text-2,#4b5563); }
    .g-apercu-msg:empty { display:none; }
    @media (max-width:640px){ .g-fact { grid-template-columns:1fr; gap:1px 0; } .g-fact dt { margin-top:7px; } }
    @media (max-width:480px){ .g-hide-sm { display:none; } }
    /* ── Convention de groupement (co-traitance v2, vague 2) — styles locaux à cette page ── */
    .cv-card { margin-bottom:16px; }
    .cv-head { display:flex; gap:6px 8px; align-items:center; flex-wrap:wrap; }
    .cv-card .cv-title { margin:0; font-family:inherit; font-size:13.5px; font-weight:700; letter-spacing:0; }
    .cv-card .cv-title:focus { outline:none; }
    .cv-card .cv-sec { margin-top:16px; }
    .cv-card .cv-sec-t { display:flex; align-items:center; flex-wrap:wrap; gap:4px; margin:0 0 6px; font-family:inherit; font-size:13px; font-weight:700; letter-spacing:0; }
    .cv-card .cv-lead { margin:10px 0 0; font-size:13px; color:var(--text-2,#4b5563); }
    .cv-legal { display:flex; gap:8px; align-items:flex-start; margin-top:12px; padding:9px 12px; border-radius:10px; background:var(--surface-2,#f6f7f9); border:1px solid var(--border,#e6e8ec); font-size:12.5px; color:var(--text-2,#4b5563); line-height:1.45; }
    .cv-ok-banner { display:flex; gap:9px; align-items:flex-start; margin-top:12px; padding:10px 12px; border-radius:10px; background:var(--success-weak,#e7f7ee); border:1px solid var(--success,#1a7f4b); color:var(--success-text,#1a7f4b); font-size:12.5px; }
    .cv-meta { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; margin-top:10px; font-size:12.5px; color:var(--text-2,#4b5563); }
    .cv-meta b { color:var(--text,#16181d); }
    .cv-hashw { display:inline-flex; align-items:center; gap:4px; }
    .cv-hash { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; padding:1px 6px; border-radius:6px; background:var(--surface-3,#eef0f3); color:var(--text,#16181d); }
    .cv-hashfull { display:block; margin-top:6px; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11.5px; word-break:break-all; opacity:.85; }
    .cv-fact { margin-top:12px; }
    .cv-rules { grid-template-columns:minmax(0,2fr) minmax(0,3fr); font-size:13px; }
    .cv-tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
    .cv-tbl th { text-align:left; font-weight:600; color:var(--text-2,#4b5563); padding:7px 8px; border-bottom:1px solid var(--border,#e6e8ec); }
    .cv-tbl td { padding:7px 8px; border-bottom:1px solid var(--hairline,#eef0f3); vertical-align:top; }
    .cv-tbl .num { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
    .cv-tbl tfoot td { font-weight:700; border-bottom:0; padding-top:9px; }
    .cv-tbl .cv-me td { background:var(--surface-2,#f6f7f9); }
    .cv-read { margin-top:16px; }
    .cv-read > summary { display:flex; align-items:center; gap:8px; min-height:40px; padding:8px 12px; border:1px solid var(--border,#e6e8ec); border-radius:10px; background:var(--surface,#fff); font-size:13px; font-weight:600; cursor:pointer; list-style:none; }
    .cv-read > summary::-webkit-details-marker { display:none; }
    .cv-read > summary:focus-visible { outline:none; box-shadow:0 0 0 3px var(--ring,rgba(27,79,255,.26)); }
    .cv-read > summary .cv-chev { display:inline-flex; line-height:0; transition:transform .15s; }
    .cv-read[open] > summary .cv-chev { transform:rotate(90deg); }
    .cv-box { margin-top:8px; padding:12px 14px; border:1px solid var(--border,#e6e8ec); border-radius:10px; background:var(--surface-2,#f6f7f9); font-size:13px; }
    .cv-box ul { margin:4px 0 0; padding-left:18px; } .cv-box li { margin:3px 0; }
    .cv-doc { margin-top:8px; padding:14px 16px; max-height:60vh; overflow:auto; border:1px solid var(--border,#e6e8ec); border-radius:10px; background:var(--surface-2,#f6f7f9); font-size:13px; line-height:1.55; overflow-wrap:anywhere; }
    .cv-doc:focus-visible { outline:none; box-shadow:0 0 0 3px var(--ring,rgba(27,79,255,.26)); }
    .cv-card .cv-doc h3 { margin:0 0 10px; font-family:inherit; font-size:15px; font-weight:800; letter-spacing:-.01em; }
    .cv-card .cv-doc h4 { margin:16px 0 6px; font-size:13.5px; font-weight:700; }
    .cv-doc p { margin:6px 0; } .cv-doc ul { margin:6px 0; padding-left:20px; } .cv-doc li { margin:3px 0; }
    .cv-doc .cv-tbl { margin:6px 0; background:var(--surface,#fff); border-radius:8px; }
    .cv-doc .cv-total { margin-top:10px; }
    .cv-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:12px; }
    .cv-msg { font-size:12.5px; color:var(--text-2,#4b5563); }
    .cv-msg:empty { display:none; }
    .cv-msg.err { color:var(--danger-text,#b42318); }
    .cv-accord { margin-top:16px; padding:14px 16px; border:1.5px solid var(--accent,#3b5bdb); border-radius:12px; background:var(--surface,#fff); }
    .cv-accord.ok { border-color:var(--success,#1a7f4b); }
    .cv-accord.plain { border:1px solid var(--border,#e6e8ec); background:var(--surface-2,#f6f7f9); }
    .cv-accord .cv-sec-t { margin-bottom:2px; }
    .cv-okline { display:flex; gap:10px; align-items:flex-start; }
    .cv-okline:focus { outline:none; }
    .cv-form { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; margin-top:12px; }
    .cv-form label { display:block; margin-bottom:4px; font-size:12px; font-weight:600; color:var(--text-2,#4b5563); }
    .cv-form .inp { width:100%; }
    .cv-check { display:flex; gap:9px; align-items:flex-start; margin-top:14px; font-size:13px; font-weight:600; cursor:pointer; }
    .cv-check input { flex:none; width:18px; height:18px; margin:1px 0 0; accent-color:var(--accent,#3b5bdb); cursor:pointer; }
    .cv-check input:focus-visible { outline:2px solid var(--accent,#3b5bdb); outline-offset:2px; }
    .cv-note { display:flex; gap:7px; align-items:flex-start; margin-top:8px; font-size:12px; line-height:1.45; color:var(--text-2,#4b5563); }
    .cv-note svg, .cv-legal svg, .cv-ok-banner svg { flex:none; margin-top:1px; }
    .cv-sigs { list-style:none; margin:0; padding:0; }
    .cv-sigs li { padding:8px 0; border-bottom:1px solid var(--hairline,#eef0f3); font-size:12.5px; }
    .cv-sigs li:last-child { border-bottom:0; }
    .cv-sig-h { display:flex; gap:4px 7px; align-items:center; flex-wrap:wrap; }
    .cv-sig-h .pill { margin-left:auto; }
    .cv-sig-d { margin-top:2px; font-size:12px; color:var(--text-2,#4b5563); }
    .cv-alert { display:flex; gap:8px 10px; align-items:center; flex-wrap:wrap; margin-top:12px; padding:10px 12px; border-radius:10px; border:1px solid var(--accent,#3b5bdb); background:var(--accent-weak,#eef2ff); }
    .cv-stepline { margin-top:12px; font-size:12.5px; color:var(--text-2,#4b5563); }
    .cv-stepline b { color:var(--text,#16181d); }
    ol.cv-steps { list-style:none; padding:0 0 4px; margin:8px 0 4px; }
    @media (max-width:640px){
      ol.cv-steps .gs { min-width:0; padding-left:2px; padding-right:2px; font-size:10.5px; line-height:1.3; -webkit-hyphens:auto; hyphens:auto; }
      .cv-form, .cv-rules { grid-template-columns:1fr; }
      .cv-tbl thead { display:none; }
      .cv-tbl, .cv-tbl tbody, .cv-tbl tfoot, .cv-tbl tr, .cv-tbl td { display:block; width:100%; }
      .cv-tbl tr { padding:6px 0; border-bottom:1px solid var(--hairline,#eef0f3); }
      .cv-tbl td { display:flex; justify-content:space-between; gap:12px; padding:2px 0; border:0; text-align:right; }
      .cv-tbl td::before { content:attr(data-label); flex:none; max-width:45%; text-align:left; font-weight:600; color:var(--text-2,#4b5563); }
      .cv-tbl td.num { white-space:normal; }
      .cv-tbl tfoot tr { border-bottom:0; }
      .cv-tbl tfoot td.cv-tot-l { display:none; }
      .cv-tbl .cv-me td { background:transparent; }
      .cv-tbl .cv-me { background:var(--surface-2,#f6f7f9); border-radius:8px; padding:6px 8px; }
      .cv-doc { padding:12px; }
    }
    /* ── Vague 4 : journal vérifiable par le membre + DPGF de lot — styles locaux à cette page ── */
    /* .jv-acts / .jv (verdict du journal) : styles partagés dans styles.css */
    /* Les bulles (i) masquées restent dans le calcul du défilement : sans ceci, la zone de travail
       défilait horizontalement (bulles de la convention près du bord droit). Les bulles visibles
       sont recadrées dans l'écran par fitTip(). */
    .work { overflow-x:hidden; }
    .dp-head, .dp-row { display:grid; grid-template-columns:minmax(0,1fr) 76px 84px 112px 112px 34px; gap:6px; align-items:center; }
    .dp-head { margin-top:16px; padding:0 0 5px; border-bottom:1px solid var(--hairline,#eef0f3); font-size:11.5px; font-weight:600; color:var(--text-2,#4b5563); }
    .dp-row { padding:6px 0; border-bottom:1px solid var(--hairline,#eef0f3); }
    .dp-row > div { min-width:0; }
    .dp-row .inp { width:100%; height:34px; padding:0 8px; font-size:12.5px; min-width:0; }
    .dp-num, .dp-row .inp.dp-num { text-align:right; }
    .dp-amt { text-align:right; font-size:12.5px; font-variant-numeric:tabular-nums; }
    .dp-lab, .dp-lab-inl { display:none; }
    .dp-del { justify-self:end; }
    .dp-tot { display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 12px; margin-top:12px; font-size:13px; }
    .dp-cmp { display:flex; gap:7px; align-items:flex-start; margin-top:6px; font-size:12.5px; line-height:1.45; }
    .dp-cmp:empty { display:none; }
    .dp-acts { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:16px; }
    .dp-prev { max-height:42vh; overflow:auto; margin-top:10px; border:1px solid var(--border,#e6e8ec); border-radius:8px; background:var(--surface,#fff); }
    .dp-prev:focus-visible { outline:none; box-shadow:0 0 0 3px var(--ring,rgba(27,79,255,.26)); }
    .dp-prev table { border-collapse:collapse; font-size:11.5px; width:100%; }
    .dp-prev th { padding:5px 8px; border-bottom:1px solid var(--border,#e6e8ec); text-align:left; font-weight:600; color:var(--text-2,#4b5563); white-space:nowrap; }
    .dp-prev td { padding:4px 8px; border-bottom:1px solid var(--hairline,#eef0f3); white-space:nowrap; color:var(--text,#16181d); vertical-align:top; }
    .dp-prev .num { text-align:right; font-variant-numeric:tabular-nums; }
    .dp-prev td.des { white-space:normal; min-width:140px; }
    .dp-card { scroll-margin-top:84px; }
    @media (max-width:640px){
      .dp-head { display:none; }
      .dp-row { grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px 10px; padding:12px 0; }
      .dp-row .dp-des { grid-column:1 / -1; }
      .dp-lab { display:block; margin-bottom:3px; font-size:11px; font-weight:600; color:var(--text-2,#4b5563); }
      .dp-amt { text-align:left; align-self:end; padding-bottom:7px; }
      .dp-amt .dp-lab { margin-bottom:5px; }
      .dp-row .btn.dp-del { grid-column:1 / -1; justify-self:start; width:auto; min-width:0; padding:0 10px; gap:6px; }
      /* Aperçu du fichier : une ligne de la DPGF par bloc (aucun défilement horizontal à 375 px) */
      .dp-prev thead { display:none; }
      .dp-prev table, .dp-prev tbody, .dp-prev tfoot, .dp-prev tr, .dp-prev td { display:block; width:100%; }
      .dp-prev tr { padding:7px 10px; border-bottom:1px solid var(--hairline,#eef0f3); }
      .dp-prev td { display:flex; justify-content:space-between; gap:12px; padding:1px 0; border:0; white-space:normal; text-align:right; }
      .dp-prev td::before { content:attr(data-label); flex:none; max-width:50%; text-align:left; font-weight:600; color:var(--text-2,#4b5563); }
      .dp-prev td:empty { display:none; }
      .dp-prev td.des { min-width:0; }
      .dp-prev tfoot tr { display:flex; justify-content:space-between; gap:12px; border-bottom:0; }
      .dp-prev tfoot td { width:auto; }
      .dp-del .dp-lab-inl { display:inline; font-size:12px; }
    }
  </style>
</head>
<body>
  <div class="g-state" id="loading"><div class="spin" style="margin:0 auto 12px"></div>Chargement de votre espace…</div>

  <div class="app" id="shell" style="display:none">
    <aside class="side">
      <div class="brand"><span class="wordmark"><span class="wm-text">adjug</span><svg class="wm-o" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="21" stroke="currentColor" stroke-opacity=".16" stroke-width="3"/><circle cx="24" cy="24" r="13.5" stroke="currentColor" stroke-opacity=".42" stroke-width="3"/><circle cx="24" cy="24" r="6.5" fill="currentColor"/></svg></span><span class="org-sub" id="brand-sub">Espace partenaire</span></div>
      <div class="nav-group">Votre invitation</div>
      <a class="nav-item" data-view="monao" data-allowed="1"><i data-lucide="folder-open"></i>Le marché</a>
      <!-- Le menu de l'application tel qu'il est depuis la réorganisation (vague 1, RUBRIQUES de app.js) : les
           rubriques, puis le groupe « Réglages ». Verrouillé tant que le partenaire n'a pas de compte. -->
      <div class="nav-group">Avec un compte Adjugo</div>
      <a class="nav-item" data-view="dashboard"><i data-lucide="house"></i>Accueil</a>
      <a class="nav-item" data-view="sourcing" data-allowed="1"><i data-lucide="search"></i>Trouver des marchés</a>
      <a class="nav-item" data-view="amont" data-allowed="1" id="nav-amont" style="display:none"><i data-lucide="calendar-clock"></i>Projets à venir</a>
      <a class="nav-item" data-view="pipeline"><i data-lucide="folder-kanban"></i>Mes marchés</a>
      <a class="nav-item" data-view="cotraitants"><i data-lucide="handshake"></i>Partenaires</a>
      <a class="nav-item" data-view="documents"><i data-lucide="folder-lock"></i>Mes documents</a>
      <a class="nav-item" data-view="company"><i data-lucide="building-2"></i>Mon entreprise</a>
      <div class="nav-group">Réglages</div>
      <a class="nav-item" data-view="team"><i data-lucide="users-round"></i>Collègues</a>
      <a class="nav-item" data-view="billing"><i data-lucide="credit-card"></i>Abonnement</a>
      <div class="side-foot">
        <div class="user"><div class="av" id="g-av">PA</div><div style="min-width:0"><b id="g-name">Partenaire</b><small id="g-role" style="display:block">Partenaire invité</small></div></div>
      </div>
    </aside>

    <main class="work">
      <header class="top">
        <div class="top-title"><div style="display:flex;align-items:center;min-width:0"><h1 id="g-title" style="min-width:0">Le marché</h1><span id="g-tip" style="flex:none;display:inline-flex"></span></div><div class="sub" id="g-sub"></div></div>
        <div class="spacer"></div>
        <a class="btn primary" href="/app?inscription" target="_blank" rel="noopener"><i data-lucide="sparkles"></i>Créer mon compte<span class="g-hide-sm">&nbsp;Adjugo</span></a>
      </header>
      <div style="padding:18px 22px 60px;max-width:980px">
        <div class="g-banner" id="g-banner"></div>
        <div id="content"></div>
      </div>
    </main>
  </div>

  <script>
    const TOKEN = decodeURIComponent(location.pathname.split("/invite/")[1] || "").replace(/\/.*$/, "");
    const ALLOWED = { monao: 1, sourcing: 1, amont: 1 };
    const VIEW_TITLE = {
      monao: ["Le marché", "Le dossier partagé avec vous — apportez votre part."],
      sourcing: ["Trouver des marchés", "Les marchés publiés sur les sources officielles."],
      amont: ["Projets à venir", "Surveillez les marchés publics qui vous correspondent."],
    };
    let DATA = null, ICONS, CLAIM_BTN = null;
    // MY_TOKEN : compte Adjugo de ce navigateur (s'il existe) ; MY_COMPANY : entreprise saisie dans
    // MA part (repère « vous ») ; RELOAD_JOURNAL : rafraîchit « Mon journal » après une action.
    let MY_TOKEN = null, MY_COMPANY = "", RELOAD_JOURNAL = null;
    // Rédaction, vague 4 : l'écran « Mes parties du dossier de présentation » (redaction-partenaire.js).
    let RP = null;
    const PIECE_TYPES = [["kbis", "Kbis"], ["fiscale", "Attestation fiscale"], ["sociale", "Attestation sociale (URSSAF)"], ["assurance", "Assurance (RC / décennale)"], ["rib", "RIB"], ["qualification", "Qualification / certificat"], ["dpgf_lot", "Tableau de prix du lot (prix de vente)"], ["autre", "Autre pièce"]];
    const PIECE_LABEL = Object.fromEntries(PIECE_TYPES);
    const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    // Garde de schéma pour TOUT lien construit depuis une donnée (avis d'origine, résultats de
    // recherche…) : esc() n'empêche pas un « javascript: » d'être exécuté au clic. On n'accepte
    // qu'une adresse web absolue (http/https) ou un chemin interne (/…) ; sinon lien neutre « # ».
    const safeUrl = (u) => { const s = String(u == null ? "" : u).trim(); return (s && !/[\u0000-\u001f\u007f]/.test(s) && /^(https?:\/\/[^\s\/]|\/(?![\/\\]))/i.test(s)) ? s : "#"; };
    const kb = (n) => !n ? "" : n < 1024 ? n + " o" : n < 1048576 ? (n / 1024).toFixed(0) + " Ko" : (n / 1048576).toFixed(1) + " Mo";
    const eur = (n) => (n || n === 0) ? Number(n).toLocaleString("fr-FR") + " €" : "";
    const fmtDate = (s) => { if (!s) return ""; try { return new Date(s).toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" }); } catch (e) { return s; } };
    const icons = () => { try { lucide.createIcons(); } catch (e) {} };
    // Bulle d'information (i) à côté d'un titre : les phrases d'explication sortent de la page.
    // `html` est DÉJÀ échappé (peut contenir <b>) ; left=true → la bulle s'ouvre vers la gauche.
    const tip = (html, left) => html ? `<button type="button" class="tip${left ? " tip-l" : ""}"><i data-lucide="info"></i><span class="sr-only">En savoir plus</span><span class="tip-b" role="tooltip">${html}</span></button>` : "";
    // Icône lucide en ligne (remplace les émojis et glyphes Unicode), alignée sur le texte.
    const ico = (name, px, extra) => `<i data-lucide="${esc(name)}" style="width:${px || 14}px;height:${px || 14}px;flex:none;vertical-align:-2px${extra ? ";" + extra : ""}"></i>`;
    const ICO_OK = (px) => ico("check", px || 13, "color:var(--success-text,#1a7f4b)");
    // Message de confirmation : coche lucide + texte (au lieu d'un glyphe collé au texte).
    const okMsg = (el, text) => { el.innerHTML = ICO_OK() + " " + esc(text); icons(); };
    // Bulles : au toucher on donne le focus (iOS ne le fait pas pour un bouton), Échap referme,
    // et la bulle est recadrée pour ne jamais déborder de l'écran (téléphone, icône près d'un bord).
    function fitTip(t) {
      const b = t.querySelector(".tip-b"); if (!b) return;
      b.style.translate = "";
      const r = b.getBoundingClientRect(), vw = document.documentElement.clientWidth;
      let dx = 0; if (r.right > vw - 8) dx = vw - 8 - r.right; if (r.left + dx < 8) dx = 8 - r.left;
      if (dx) b.style.translate = Math.round(dx) + "px 0";
    }
    const tipOf = (e) => (e.target && e.target.closest) ? e.target.closest(".tip") : null;
    ["mouseover", "focusin"].forEach(ev => document.addEventListener(ev, e => { const t = tipOf(e); if (t) fitTip(t); }));
    document.addEventListener("click", e => { const t = tipOf(e); if (t) { t.focus(); fitTip(t); } });
    document.addEventListener("keydown", e => { const a = document.activeElement; if (e.key === "Escape" && a && a.classList && a.classList.contains("tip")) a.blur(); });
    const content = () => document.getElementById("content");
    // Message d'erreur lisible depuis un `detail` FastAPI : chaîne, {message}, ou liste de validation pydantic.
    function errText(e, fallback) {
      const dt = e && e.detail;
      if (!dt) return fallback;
      if (typeof dt === "string") return dt;
      if (dt.message) return dt.message;
      if (Array.isArray(dt)) return dt.map(x => String((x && x.msg) || "").replace(/^Value error,\s*/i, "")).filter(Boolean).join(" · ") || fallback;
      return fallback;
    }

    const LABELS = { objet: "Objet", acheteur: "Acheteur", lieu: "Lieu d'exécution", duree: "Durée", delais: "Délais", lots: "Lots / allotissement", allotissement: "Allotissement", pieces_requises: "Pièces attendues", montant_estime: "Montant estimé", type_marche: "Type de marché", procedure: "Procédure", date_limite: "Date limite" };
    function objLabel(x) {
      const name = x.nom || x.name || x.label || x.intitule || x.critere || x.libelle || x.titre || x.designation || x.lot || "";
      const weight = x.ponderation || x.poids || x.pourcentage || x.coefficient || x.pct || "";
      if (name) return esc(name) + (weight ? ` — <b>${esc(weight)}</b>` : "");
      return esc(Object.values(x).filter(v => typeof v !== "object").join(" · "));
    }
    function renderVal(v) {
      if (Array.isArray(v)) { const items = v.map(x => (x && typeof x === "object") ? objLabel(x) : esc(x)).filter(Boolean); return items.length ? `<ul class="g-list">${items.map(i => `<li>${i}</li>`).join("")}</ul>` : ""; }
      if (v && typeof v === "object") return `<ul class="g-list"><li>${objLabel(v)}</li></ul>`;
      return esc(v);
    }

    // ── Modale légère (récap avant envoi, saisie du code de vérification) ──
    // Remplace window.prompt/confirm (dialogues système gris → perçus comme du phishing par
    // un dirigeant non technique, collage bloqué sur mobile). Renvoie une Promise.
    function openModal({ title, bodyHtml, confirmLabel, cancelLabel, withInput, inputLabel, extraLabel, noteHtml, maxWidth, focusCancel }) {
      return new Promise(resolve => {
        const ov = document.createElement("div");
        ov.style.cssText = "position:fixed;inset:0;background:rgba(17,24,39,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px";
        const box = document.createElement("div");
        box.style.cssText = "background:var(--card,#fff);border-radius:14px;max-width:" + (maxWidth || 440) + "px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3)";
        // Vraie boîte de dialogue pour les lecteurs d'écran (titre annoncé, Échap pour fermer).
        const uid = "mdl" + Math.random().toString(36).slice(2, 9);
        box.setAttribute("role", "dialog"); box.setAttribute("aria-modal", "true"); box.setAttribute("aria-labelledby", uid + "-t");
        box.innerHTML = `<div id="${uid}-t" style="font-size:16px;font-weight:800;margin-bottom:8px">${esc(title || "")}</div><div class="small" style="color:var(--text-2,#4b5563);line-height:1.5">${bodyHtml || ""}</div>`;
        let input = null;
        if (withInput) {
          if (inputLabel) box.appendChild($(`<label class="small" for="${uid}-i" style="display:block;font-weight:600;margin:12px 0 4px">${esc(inputLabel)}</label>`));
          input = document.createElement("input"); input.id = uid + "-i"; input.className = "inp"; input.style.cssText = "width:100%;font-size:18px;letter-spacing:3px;text-align:center";
          input.inputMode = "numeric"; input.autocomplete = "one-time-code"; input.maxLength = 6; input.placeholder = "••••••";
          box.appendChild(input);
        }
        const extra = document.createElement("div"); extra.className = "small"; extra.style.cssText = "margin-top:8px;min-height:16px;color:#b8730a";
        extra.setAttribute("role", "status"); if (noteHtml) extra.innerHTML = noteHtml;   // noteHtml : DÉJÀ échappé
        box.appendChild(extra);
        const bar = document.createElement("div"); bar.className = "row"; bar.style.cssText = "gap:8px;justify-content:flex-end;margin-top:16px";
        const cancel = $(`<button class="btn">${esc(cancelLabel || "Annuler")}</button>`);
        const ok = $(`<button class="btn primary">${esc(confirmLabel || "Confirmer")}</button>`);
        let extraBtn = null;
        if (extraLabel) { extraBtn = $(`<button class="btn" style="margin-right:auto">${esc(extraLabel)}</button>`); bar.appendChild(extraBtn); }
        bar.appendChild(cancel); bar.appendChild(ok); box.appendChild(bar);
        ov.appendChild(box); document.body.appendChild(ov); icons();
        const prevFocus = document.activeElement;
        const close = (val) => { ov.remove(); try { if (prevFocus && prevFocus.isConnected && prevFocus.focus) prevFocus.focus({ preventScroll: true }); } catch (e) {} resolve(val); };
        ov.addEventListener("keydown", e => { if (e.key === "Escape") { e.preventDefault(); close(null); } });
        cancel.onclick = () => close(null);
        ok.onclick = () => close(withInput ? { value: (input.value || "").trim() } : true);
        if (extraBtn) extraBtn.onclick = () => close({ extra: true });
        ov.addEventListener("click", e => { if (e.target === ov) close(null); });
        setTimeout(() => (input || (focusCancel ? cancel : ok)).focus(), 40);   // action engageante : focus sur « Revenir »
        if (input) input.addEventListener("keydown", e => { if (e.key === "Enter") ok.click(); });
      });
    }

    // ── Routeur ──
    function setActive(view) {
      document.querySelectorAll(".nav-item").forEach(a => a.classList.toggle("active", a.dataset.view === view && ALLOWED[view]));
      const t = VIEW_TITLE[view] || ["", ""];
      document.getElementById("g-title").textContent = t[0];
      document.getElementById("g-sub").textContent = t[1];
    }
    function nav(view, label) {
      if (!ALLOWED[view]) return renderBlocked(label);
      setActive(view);
      if (view === "monao") renderMonAO();
      else renderSourcing();
    }
    function renderBlocked(label) {
      document.getElementById("g-title").textContent = label || "Accès réservé";
      document.getElementById("g-sub").textContent = "";
      content().innerHTML =
        `<div class="card pad" style="text-align:center;padding:46px 24px">
           <div style="color:var(--text-2,#6b7280)">${ico("lock", 34)}</div>
           <h2 style="margin:10px 0 4px;font-size:18px">« ${esc(label)} » est réservé aux membres</h2>
           <p class="muted" style="max-width:460px;margin:4px auto 0">Vous êtes invité sur un dossier précis. Commencez votre essai gratuit de 30 jours pour débloquer tout l'espace : vos marchés, vos documents, vos collègues, la facturation…</p>
           <a class="btn primary" href="/app?inscription" target="_blank" rel="noopener" style="margin-top:16px"><i data-lucide="sparkles"></i>Commencer mon essai gratuit de 30 jours</a>
         </div>`;
      icons();
    }

    // ── Stepper + « Pourquoi vous dans ce groupement » (for_member, vue membre) ──
    // Règle : on n'affiche QUE ce que l'API envoie. Jamais le score seul du mandataire,
    // jamais le prix d'un autre membre (l'API ne les transmet pas au partenaire).
    const SOON_STEPS = { convention_a_signer: 1, pret_a_deposer: 1 };
    const ROLE_LABEL = { cotraitant: "partenaire", sous_traitant: "sous-traitant", mandataire: "chef de file" };
    const MEMBER_STATUS = { invited: ["invité", "pill neutral"], draft: ["brouillon", "pill neutral"], submitted: ["part soumise", "pill go"] };
    // Horodatages de l'API : UTC « naïf » (sans fuseau, ex. 2026-10-08T01:30:11) → lus comme UTC,
    // affichés à l'heure locale. Une date seule (2026-11-07) ou déjà datée d'un fuseau reste telle quelle.
    const apiDate = (s) => new Date(typeof s === "string" && /T\d{2}:\d{2}(:\d{2}(\.\d+)?)?$/.test(s) ? s + "Z" : s);
    const fmtShort = (s) => { if (!s) return ""; try { return apiDate(s).toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }); } catch (e) { return s; } };
    const fmtDT = (s) => { if (!s) return ""; try { const d = apiDate(s); return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }) + " " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return s; } };
    // Stepper 1→5 (vague 2) : étapes du parcours dérivées par le serveur (fait / en cours / à faire).
    const ETAPE_SR = { fait: "fait", en_cours: "en cours", a_faire: "à venir" };
    function renderEtapes(st, etapes) {
      const wrap = document.createElement("div");
      const cur = etapes.find(e => e.status === "en_cours");
      const n = st.etape || (cur && cur.n);
      if (n) wrap.appendChild($(`<div class="cv-stepline">Étape <b>${esc(n)}</b> sur ${esc(etapes.length)}${st.label ? " · " + esc(st.label) : ""}</div>`));
      const ol = $(`<ol class="gstep cv-steps" aria-label="Étapes du groupement"></ol>`);
      etapes.forEach(e => {
        const cls = e.status === "fait" ? " done" : e.status === "en_cours" ? " cur" : "";
        ol.appendChild($(`<li class="gs${cls}"${e.status === "en_cours" ? ' aria-current="step"' : ""}>${esc(e.label)}<span class="sr-only"> (${ETAPE_SR[e.status] || ""})</span></li>`));
      });
      wrap.appendChild(ol);
      return wrap;
    }
    function renderForMember(head, fm, d) {
      const st = fm.state || {};
      const steps = Array.isArray(st.steps) ? st.steps : [];
      const etapes = Array.isArray(st.etapes) ? st.etapes : [];
      if (etapes.length) head.appendChild(renderEtapes(st, etapes));
      else if (steps.length) {
        let idx = steps.findIndex(s => s.key === st.state);
        if (idx < 0 && typeof st.index === "number") idx = st.index;
        const gs = $(`<div class="gstep" aria-label="Étapes du groupement"></div>`);
        steps.forEach((s, i) => {
          const cls = i < idx ? " done" : i === idx ? " cur" : "";
          const soon = (SOON_STEPS[s.key] && i > idx) ? " soon" : "";
          gs.appendChild($(`<div class="gs${cls}${soon}"${i === idx ? ' aria-current="step"' : ""}>${esc(s.label)}</div>`));
        });
        head.appendChild(gs);
      }
      const box = $(`<div class="g-sec"></div>`);
      box.appendChild($(`<b style="font-size:13.5px">Pourquoi vous dans ce groupement</b>`));
      const cols = $(`<div class="sg-cols"></div>`);
      const grp = $(`<div class="sg-col grp"></div>`);
      if (fm.score_groupement == null) grp.innerHTML = `<div class="sg-big" style="font-size:22px">—</div><div class="sg-lab">Score du groupement : calculé par le chef de file après analyse</div>`;
      else grp.innerHTML = `<div class="sg-big">${esc(fm.score_groupement)}<span style="font-size:15px;font-weight:600;opacity:.75"> %</span></div><div class="sg-lab">à plusieurs</div>`;
      cols.appendChild(grp);
      const col2 = $(`<div class="sg-col"></div>`);
      const ap = $(`<div class="row wrap" style="gap:5px;align-items:center;font-size:12.5px"></div>`);
      ap.appendChild($(`<span style="font-weight:600">Vous apportez :</span>`));
      if ((fm.my_apport || []).length) fm.my_apport.forEach(a => ap.appendChild($(`<span class="sg-chip by">${esc(a.label || a.key)}</span>`)));
      else ap.appendChild($(`<span class="muted">précisé par le chef de file après analyse</span>`));
      col2.appendChild(ap);
      const se = fm.seuils || {};
      const seuil = (ok, yes, no) => $(`<div class="small g-chk" style="margin-top:6px;color:${ok ? "var(--success-text,#1a7f4b)" : "var(--text-2,#6b7280)"}">${ok ? ico("check", 13) + esc(yes) : ico("circle", 13) + esc(no)}</div>`);
      col2.appendChild(seuil(se.ca_cumule_ok === true, "Chiffre d'affaires cumulé suffisant", "Chiffre d'affaires cumulé à vérifier"));
      col2.appendChild(seuil(se.qualifs_ok === true, "Qualifications exigées couvertes", "Qualifications exigées à vérifier"));
      cols.appendChild(col2);
      box.appendChild(cols);
      if ((fm.gaps_combles || []).length) {
        const g = $(`<div class="small" style="margin-top:10px"><b>Ce que le groupement comble :</b></div>`);
        const gl = $(`<ul class="g-list"></ul>`);
        fm.gaps_combles.forEach(l => gl.appendChild($(`<li>${esc(l)}</li>`)));
        g.appendChild(gl); box.appendChild(g);
      }
      // Membres : entreprise · rôle · statut. Le mandataire (nom fourni par l'API) ouvre la liste.
      const members = Array.isArray(st.members) ? st.members : [];
      const nM = st.n_members != null ? st.n_members : members.length;
      const nS = st.n_submitted != null ? st.n_submitted : members.filter(m => m.status === "submitted").length;
      box.appendChild($(`<div class="row" style="gap:8px;align-items:center;margin-top:12px"><b style="font-size:13px;flex:1">Les membres du groupement</b><span class="pill neutral" style="font-size:11px">parts reçues ${esc(nS)} sur ${esc(nM)}</span></div>`));
      const ul = $(`<ul class="g-members"></ul>`);
      if (d.mandataire) ul.appendChild($(`<li><span style="font-weight:600">${esc(d.mandataire)}</span><span class="muted">· chef de file</span></li>`));
      members.forEach(m => {
        const stt = MEMBER_STATUS[m.status] || [m.status || "", "pill neutral"];
        const me = !!(d.invited && d.invited.company && m.company === d.invited.company);
        ul.appendChild($(`<li><span style="font-weight:600">${esc(m.company || "Partenaire")}</span><span class="muted">· ${esc(ROLE_LABEL[m.role] || m.role || "partenaire")}</span>${me ? '<span class="muted">(vous)</span>' : ""}<span class="${stt[1]}" style="font-size:10.5px;margin-left:auto">${esc(stt[0])}</span></li>`));
      });
      if (!members.length) ul.appendChild($(`<li class="muted">Aucun autre partenaire invité pour l'instant.</li>`));
      box.appendChild(ul);
      // Vague 2 : une convention en brouillon ou plus à jour fait foi, et le total n'est révélé
      // qu'à sa génération. L'encadré « offre figée » ne s'affiche donc que sans convention, ou
      // avec une convention générée (même total que son annexe).
      const cvSt = st.convention && st.convention.status;
      if (st.offer_frozen && (!cvSt || CV_ACTIVE[cvSt])) {
        box.appendChild($(`<div class="offre-box"><i data-lucide="lock"></i><div style="flex:1"><div style="font-weight:700">Offre commune figée${st.frozen_at ? " le " + esc(fmtShort(st.frozen_at)) : ""}</div>${fm.warning_two_members ? '<div class="small muted">À deux, le total révèle mécaniquement la part de l\'autre.</div>' : ""}</div>${st.total_offre_ht != null ? `<div class="offre-total">${esc(eurHT(st.total_offre_ht))}</div>` : ""}</div>`));
      }
      head.appendChild(box);
    }

    // ── « Comment vous serez noté » : la grille de l'acheteur, en LECTURE (même grille que le chef
    // de file). Critères et poids TELS QU'ÉCRITS dans le règlement, avec leur phrase ; ce que le
    // dossier impose (cadre de réponse, limites, visite). Tout passe par esc().
    // « 20 pages au maximum », « 1 page au maximum par référence » : accord et partie visée.
    const GN_OBJET = { cv: "par CV", reference: "par référence", question: "pour une question", question_chaque: "par question",
      fiche: "par fiche", synthese: "pour la synthèse", lettre: "pour la lettre", annexe: "par annexe" };
    function gnLim(x) {
      if (x.type === "police") { const s = [x.police, x.taille != null ? x.taille : ""].filter(v => v !== "" && v != null).join(" "); return "Police : " + (s || x.texte || ""); }
      const un = Number(x.valeur) === 1;
      const u = ({ pages: un ? "page" : "pages", mots: un ? "mot" : "mots", caracteres: un ? "caractère" : "caractères", lignes: un ? "ligne" : "lignes" })[x.type] || x.type;
      const o = x.objet ? " " + (GN_OBJET[x.objet] || "") : "";
      return ((x.valeur != null ? Number(x.valeur).toLocaleString("fr-FR") + " " + u : (x.texte || "")) + " au maximum" + o).trim();
    }
    function renderGrille(g) {
      const card = $(`<section class="card pad gn-card" style="margin-bottom:16px" aria-labelledby="gn-title"></section>`);
      card.appendChild($(`<div class="row" style="gap:4px;align-items:center"><h2 id="gn-title" style="font-size:15px;font-weight:800;margin:0">Comment vous serez noté</h2>${tip("Les critères de jugement et leurs poids, repris du règlement de la consultation avec la phrase où Adjugo les a trouvés. Un poids n'est affiché que s'il est écrit tel quel dans cette phrase, ou s'il a été saisi par le chef de file (c'est alors indiqué). C'est la même grille que celle du chef de file : elle sert de base commune au groupement. Le règlement fait foi.")}</div>`));
      const crit = Array.isArray(g.criteres) ? g.criteres : [];
      if (crit.length) {
        const ul = $(`<ul class="gn-list"></ul>`);
        crit.forEach(l => {
          const pill = l.ecarte ? `<span class="pill neutral gn-pill">retiré</span>`
            : (l.confirme && l.statut === "a_verifier") ? `<span class="pill neutral gn-pill">confirmé par le chef de file</span>`
            : l.statut === "a_verifier" ? `<span class="pill a_etudier gn-pill">à vérifier dans le règlement</span>` : "";
          // Vague 5 : les sous-critères tels qu'écrits dans le règlement.
          const sous = (l.sous_criteres || []).length ? `<ul class="gn-sous">${l.sous_criteres.map(x => `<li><span class="gn-sous-n">${esc(x.critere)}</span>${x.poids ? `<span class="gn-poids num">${esc(x.poids)}</span>` : (x.statut === "a_verifier" ? `<span class="muted small">poids à vérifier</span>` : "")}</li>`).join("")}</ul>` : "";
          const cs = l.controle_sous && (l.controle_sous.statut === "ecart" || l.controle_sous.statut === "non_verifiable") ? `<span class="muted small gn-sous-ctl">${esc(l.controle_sous.message)}</span>` : "";
          ul.appendChild($(`<li class="gn-row${l.ecarte ? " off" : ""}"><span class="gn-crit">${esc(l.critere)}</span>${l.poids ? `<span class="gn-poids num">${esc(l.poids)}</span>` : ""}${pill}${sous}${cs}</li>`));
        });
        card.appendChild(ul);
      }
      const pm = g.ponderation && g.ponderation.message, ct = g.controle_total || {};
      if (pm) card.appendChild($(`<p class="muted small gn-note">${esc(pm)}</p>`));
      if (ct.statut === "ecart" || ct.statut === "incomplet") card.appendChild($(`<div class="warn-box">${ico("triangle-alert", 15, "margin-top:1px")}<span>${esc(ct.message)}</span></div>`));
      else if (ct.message) card.appendChild($(`<p class="muted small gn-note">${esc(ct.message)}</p>`));
      const withPhrase = crit.filter(l => l.phrase);
      const ordre = (g.ordre && g.ordre.phrase) || "";
      if (withPhrase.length || ordre) {
        const det = $(`<details class="gn-det"><summary>Voir les phrases du règlement</summary></details>`);
        crit.forEach(l => det.appendChild($(`<div class="gn-src"><div class="gn-src-t">${esc(l.critere)}${l.poids ? ` <span class="muted">· ${esc(l.poids)}${l.poids_saisi ? " (lu par le chef de file)" : ""}</span>` : ""}</div>${l.phrase ? `<blockquote class="gn-q">${esc(l.phrase)}</blockquote>` : `<div class="muted small">Phrase non retrouvée dans le dossier importé.</div>`}${(l.sous_criteres || []).map(x => `<div class="gn-src-sous"><div class="small"><b>Sous-critère : ${esc(x.critere)}</b>${x.poids ? ` <span class="muted">· ${esc(x.poids)}</span>` : ""}</div><blockquote class="gn-q">${esc(x.phrase)}</blockquote></div>`).join("")}</div>`)));
        if (ordre) det.appendChild($(`<div class="gn-src"><div class="gn-src-t">Ordre des critères</div><blockquote class="gn-q">${esc(ordre)}</blockquote></div>`));
        card.appendChild(det);
      }
      // Vague 5 : l'environnement, en information neutre (où il apparaît dans la notation).
      const env = g.environnement && g.environnement.dans_la_note ? g.environnement : null;
      if (env) {
        card.appendChild($(`<div class="gn-env small">${ico("leaf", 14)}<span>${esc(env.message)}</span></div>`));
        const de = $(`<details class="gn-det"><summary>Voir où il apparaît</summary></details>`);
        (env.lieux || []).forEach(x => de.appendChild($(`<div class="gn-src">${x.libelle ? `<div class="gn-src-t">${esc(x.libelle)}${x.poids ? ` <span class="muted">· ${esc(x.poids)}</span>` : ""}</div>` : ""}<blockquote class="gn-q">${esc(x.phrase)}</blockquote></div>`)));
        card.appendChild(de);
      }
      const c = g.contraintes || {}, lim = (c.limites || []).filter(x => x && x.type), vis = c.visite && c.visite.phrase ? c.visite : null;
      const cm = Array.isArray(g.candidatures_multiples) ? g.candidatures_multiples.filter(x => x && x.message) : [];
      const ia = g.ia && g.ia.mentionne ? g.ia : null;
      card.appendChild($(`<div class="gn-sub">Ce que le dossier impose${tip("Repéré dans le texte, sans IA : un cadre de réponse fourni ou imposé, des limites de pages, de mots, de caractères ou de police, une visite obligatoire, l'interdiction de répondre à la fois seul et en groupement, une phrase sur l'intelligence artificielle. Chaque repérage garde sa phrase. Un repérage peut en manquer : le règlement fait foi.")}</div>`));
      cm.forEach(x => card.appendChild($(`<div class="warn-box">${ico("triangle-alert", 15, "margin-top:1px")}<span>${esc(x.message)}</span></div>`)));
      if (ia) card.appendChild($(`<div class="warn-box">${ico("pen-off", 15, "margin-top:1px")}<span>${esc(ia.message || "")}${(ia.phrases || []).length ? `<q class="gn-ia-q">${esc(ia.phrases[0].phrase)}</q>` : ""}</span></div>`));
      if (c.fichier_impose) {
        card.appendChild($(`<div class="warn-box">${ico("triangle-alert", 15, "margin-top:1px")}<span>${esc(c.message_fichier || "")}</span></div>`));
        if (!c.cadre_fourni) card.appendChild($(`<p class="small gn-note">Ce fichier ne figure pas dans les pièces importées : le chef de file doit le récupérer sur la plateforme de l'acheteur.</p>`));
      }
      else if (c.cadre_fourni) card.appendChild($(`<p class="small gn-note">Un cadre de réponse est fourni avec le dossier.</p>`));
      else if (c.cadre_mentionne) card.appendChild($(`<p class="small gn-note">Le règlement parle d'un cadre de réponse, mais il ne figure pas dans les fichiers lus.</p>`));
      // Pastilles : limites du mémoire, du cadre ou de l'offre ; celles d'une partie (un CV, une
      // question…) restent dans « Voir les phrases ».
      const chips = lim.filter(x => !x.objet), partielles = lim.length - chips.length;
      if (chips.length || vis) card.appendChild($(`<ul class="gn-chips">${chips.map(x => `<li>${esc(gnLim(x))}</li>`).join("")}${vis ? "<li>Visite obligatoire</li>" : ""}</ul>`));
      if (partielles) card.appendChild($(`<p class="muted small gn-note">${partielles > 1 ? "D'autres limites portent" : "Une autre limite porte"} sur une partie du dossier (un CV, une question…) : voir les phrases.</p>`));
      const rien = !c.fichier_impose && !c.cadre_fourni && !c.cadre_mentionne && !lim.length && !vis && !cm.length && !ia;
      if (rien) card.appendChild($(`<p class="muted small gn-note">Ni cadre de réponse, ni limite de pages ou de police, ni visite obligatoire repérés dans le règlement.</p>`));
      else {
        const det = $(`<details class="gn-det"><summary>Voir les phrases</summary></details>`);
        if (c.phrase_obligation) det.appendChild($(`<div class="gn-src"><div class="gn-src-t">Cadre de réponse</div><blockquote class="gn-q">${esc(c.phrase_obligation)}</blockquote></div>`));
        lim.forEach(x => det.appendChild($(`<div class="gn-src"><div class="gn-src-t">${esc(gnLim(x))}</div>${x.phrase ? `<blockquote class="gn-q">${esc(x.phrase)}</blockquote>` : ""}</div>`)));
        if (vis) det.appendChild($(`<div class="gn-src"><div class="gn-src-t">Visite obligatoire</div><blockquote class="gn-q">${esc(vis.phrase)}</blockquote></div>`));
        cm.forEach(x => det.appendChild($(`<div class="gn-src"><div class="gn-src-t">Répondre seul ou en groupement</div><blockquote class="gn-q">${esc(x.phrase)}</blockquote></div>`)));
        if (ia) (ia.phrases || []).forEach(x => det.appendChild($(`<div class="gn-src"><div class="gn-src-t">Intelligence artificielle</div><blockquote class="gn-q">${esc(x.phrase)}</blockquote></div>`)));
        if (det.children.length > 1) card.appendChild(det);
      }
      // Vague 5 : ce que le dossier DEMANDE (exigences repérées sans IA, phrase mot pour mot), en lecture.
      if (Array.isArray(g.exigences)) {
        const ex = g.exigences, n = ex.filter(x => !x.retiree).length;
        card.appendChild($(`<div class="gn-sub">Ce que le dossier demande${tip("Les phrases du règlement et du cadre de réponse qui demandent quelque chose au candidat (« le candidat présentera… », « le candidat devra… », « Décrivez… »), repérées sans IA, avec leur phrase. Le chef de file voit dans son atelier lesquelles sont traitées. Le règlement fait foi.")}</div>`));
        card.appendChild($(`<p class="small gn-note">${n ? n + " exigence" + (n > 1 ? "s" : "") + " repérée" + (n > 1 ? "s" : "") + "." : "Aucune exigence repérée dans le règlement ni dans le cadre de réponse."}</p>`));
        if (n) {
          const dx = $(`<details class="gn-det"><summary>Voir les exigences</summary></details>`);
          ex.filter(x => !x.retiree).forEach(x => dx.appendChild($(`<div class="gn-src"><div class="gn-src-t">« ${esc(x.texte)} »</div><blockquote class="gn-q">${esc(x.phrase)}</blockquote></div>`)));
          card.appendChild(dx);
        }
      }
      return card;
    }

    // ── Vue : Le marché (vue bridée + contribution + pièces) ──
    function renderMonAO() {
      const d = DATA, p = d.project || {}, a = p.analysis || {};
      const grille = (!d.apercu_minimal && a.grille_notation && Array.isArray(a.grille_notation.criteres)) ? a.grille_notation : null;
      // Les critères ne s'affichent QUE dans la carte de la grille (phrase retrouvée, poids tel
      // qu'écrit) : le serveur n'envoie plus la liste brute proposée par l'IA.
      const facts = Object.keys(LABELS).filter(k => a[k] != null && a[k] !== "" && (!Array.isArray(a[k]) || a[k].length));
      const root = content(); root.innerHTML = "";
      RELOAD_JOURNAL = null;

      const head = $(`<div class="card pad" style="margin-bottom:16px"></div>`);
      head.appendChild($(`<div class="muted small">${d.mandataire ? "Partagé par <b>" + esc(d.mandataire) + "</b>" : "Dossier partagé"}${d.invited && d.invited.company ? " · pour " + esc(d.invited.company) : ""}</div>`));
      head.appendChild($(`<div style="font-size:21px;font-weight:800;margin:2px 0 3px;letter-spacing:-.02em">${esc(p.name || "Marché")}${tip("Vous ne voyez que ce dossier et <b>votre</b> contribution, jamais les données des autres entreprises. Conformément au RGPD, vos actions sont journalisées et visibles par le chef de file.")}</div>`));
      if (p.client) head.appendChild($(`<div class="muted small">${esc(p.client)}</div>`));
      // Invitation du RÉSEAU Adjugo pas encore acceptée (vague 3) : aperçu minimal — ni acheteur, ni
      // lien de l'avis, ni pièces, ni composition du groupement. On l'explique dans une bulle (i) et on
      // propose d'accepter depuis le compte (seul le compte destinataire, adresse confirmée, le peut).
      if (d.apercu_minimal) {
        const box = $(`<div class="g-apercu" role="region" aria-label="Aperçu limité"></div>`);
        box.appendChild($(`<div class="g-apercu-t">${ico("lock", 15)}<b>Aperçu limité</b>${tip(esc(d.apercu_message || "Acceptez l'invitation depuis votre compte Adjugo pour voir le dossier complet."))}</div>`));
        const act = $(`<div class="g-apercu-a"></div>`);
        const live = $(`<div class="small g-apercu-msg" role="status" aria-live="polite"></div>`);
        if (MY_TOKEN) {
          const b = $(`<button type="button" class="btn sm primary">${ico("check", 14)}Accepter depuis mon compte</button>`);
          b.onclick = () => claimAndOpen(b, live);
          act.appendChild(b);
        } else {
          act.appendChild($(`<a class="btn sm primary" href="/app" target="_blank" rel="noopener">${ico("log-in", 14)}Me connecter pour accepter</a>`));
          act.insertAdjacentHTML("beforeend", tip("Connectez-vous avec le compte Adjugo qui a reçu l'invitation, puis ouvrez <b>Mes marchés</b>, filtre « Où je suis partenaire », pour l'accepter."));
        }
        box.appendChild(act); box.appendChild(live);
        head.appendChild(box);
      }
      // Compte à rebours : le partenaire perçoit l'urgence et sait combien de temps il lui
      // reste pour renvoyer SA part (le mandataire assemble AVANT la date limite officielle).
      if (p.deadline) {
        const dLeft = Math.ceil((new Date(p.deadline) - new Date()) / 86400000);
        if (!isNaN(dLeft)) {
          const past = dLeft < 0, urgent = dLeft <= 3;
          const bg = past ? "#fdecea" : urgent ? "#fff4e5" : "#eef2ff";
          const bd = past ? "#d93025" : urgent ? "#b8730a" : "#3b5bdb";
          const txt = past ? "Date limite dépassée — contactez le chef de file."
            : dLeft === 0 ? "Dernier jour : soumettez votre part aujourd'hui."
            : "Il vous reste <b>" + dLeft + " jour" + (dLeft > 1 ? "s" : "") + "</b> pour soumettre votre part au chef de file.";
          head.appendChild($(`<div id="g-countdown" style="margin-top:10px;padding:9px 12px;border-radius:9px;background:${bg};border:1px solid ${bd};color:${bd};font-size:13px">${ico("clock", 14, "margin-right:4px")}${txt} <span class="muted" style="color:inherit;opacity:.8">(date limite acheteur : ${esc(fmtDate(p.deadline))})</span></div>`));
        }
      }
      CV.alertEl = document.createElement("div"); head.appendChild(CV.alertEl);   // « Convention à valider »
      if (d.for_member) { try { renderForMember(head, d.for_member, d); } catch (e) { console.warn("for_member", e); } }
      const dl = $(`<dl class="g-fact"></dl>`);
      const addFact = (t, h) => { dl.appendChild($(`<dt>${t}</dt>`)); const dd = document.createElement("dd"); dd.innerHTML = h; dl.appendChild(dd); };
      if (p.deadline && !a.date_limite) addFact("Date limite", `<b>${esc(fmtDate(p.deadline))}</b>`);   // la date du dossier (avec l'heure) prime
      facts.forEach(k => addFact(LABELS[k], renderVal(a[k])));
      if (p.source_url && safeUrl(p.source_url) !== "#") addFact("Source", `<a href="${esc(safeUrl(p.source_url))}" target="_blank" rel="noopener noreferrer nofollow">Avis d'origine ${ico("external-link", 13)}</a>`);
      if (dl.children.length) head.appendChild(dl);
      root.appendChild(head);
      if (grille) { try { root.appendChild(renderGrille(grille)); } catch (e) { console.warn("grille", e); } }

      // Convention de groupement (vague 2) : état d'attente, brouillon, texte figé + accords.
      // Aperçu minimal (invitation du réseau pas encore acceptée) : pas de convention (elle cite
      // l'acheteur et la composition du groupement ; le serveur la refuse aussi).
      CV.el = null; CV.data = null;
      if (!d.apercu_minimal) {
        const cvCard = $(`<section class="card pad cv-card" aria-labelledby="cv-title"><div class="cv-head"><h2 class="cv-title" id="cv-title" tabindex="-1">Convention de groupement</h2></div><div class="muted small" style="margin-top:8px">Chargement de la convention…</div></section>`);
        CV.el = cvCard;
        root.appendChild(cvCard);
        loadConvention();
      }

      // Rédaction, vague 4 : SES parties du dossier de présentation commun, rédigées ici, chez lui. Rien ne
      // s'affiche tant que le chef de file ne l'a pas préparé, ni pour un sous-traitant (le serveur répond
      // 404). Sa matière privée exige la clé de son espace, gardée dans ce navigateur et envoyée en en-tête.
      if (RP) { try { RP.destroy(); } catch (e) {} RP = null; }
      if (!d.apercu_minimal && window.AdjugoRedactionPartenaire && !(d.invited && d.invited.role === "sous_traitant")) {
        const rpHost = document.createElement("div");
        root.appendChild(rpHost);
        RP = window.AdjugoRedactionPartenaire.mount(rpHost, {
          base: "/api/invite/" + encodeURIComponent(TOKEN) + "/redaction", mode: "lien",
          cleStockage: "adjugo_espace_" + TOKEN, invite: "/api/invite/" + encodeURIComponent(TOKEN),
          verifyIdentity: (el, op) => verifyIdentity(el, op),
          onChange: () => { if (RELOAD_JOURNAL) RELOAD_JOURNAL(); },
        });
      }

      const docCard = $(`<div class="card pad" style="margin-bottom:16px"></div>`);
      docCard.appendChild($(`<b style="font-size:13.5px">Pièces partagées${d.documents && d.documents.length ? " (" + d.documents.length + ")" : ""}</b>`));
      if (d.apercu_minimal) docCard.appendChild($(`<div class="muted small" style="margin-top:8px">Les pièces du marché seront visibles quand vous aurez accepté l'invitation depuis votre compte Adjugo.</div>`));
      else if (!d.can_view_docs) docCard.appendChild($(`<div class="muted small" style="margin-top:8px">Le partage des pièces n'est pas activé pour ce lien.</div>`));
      else if (!d.documents || !d.documents.length) docCard.appendChild($(`<div class="muted small" style="margin-top:8px">Aucune pièce partagée pour le moment.</div>`));
      else d.documents.forEach(doc => {
        const row = $(`<div class="g-doc"></div>`);
        row.appendChild($(`<div style="min-width:0"><div style="font-weight:600;font-size:13.5px">${esc(doc.name)}</div><div class="muted small">${esc(doc.folder || doc.category || "")}${doc.size ? " · " + kb(doc.size) : ""}</div></div>`));
        row.appendChild($(`<a class="btn sm" href="/api/invite/${encodeURIComponent(TOKEN)}/doc/${encodeURIComponent(doc.id)}">Télécharger</a>`));
        docCard.appendChild(row);
      });
      root.appendChild(docCard);

      if (d.can_contribute) renderContribution(d);
      icons();
    }

    // ── Contribution + pièces (cœur de la co-construction) ──
    const inp = (ph, v) => { const i = document.createElement("input"); i.className = "inp"; i.placeholder = ph || ""; i.value = v || ""; i.style.width = "100%"; return i; };
    const ta = (ph, rows) => { const t = document.createElement("textarea"); t.className = "inp"; t.placeholder = ph || ""; t.rows = rows || 3; t.style.width = "100%"; t.style.resize = "vertical"; return t; };
    // 3e paramètre optionnel : texte (déjà échappé) de la bulle (i) placée à côté du libellé.
    // La bulle est HORS du <label> : un bouton dans un label serait « cliqué » par tout le libellé.
    const field = (label, el, tipHtml) => {
      const w = document.createElement("div"); w.style.marginTop = "10px";
      const lab = $(`<label class="small" style="display:block;color:var(--text-2,#6b7280);font-weight:600;margin-bottom:4px">${esc(label)}</label>`);
      if (tipHtml) { lab.style.marginBottom = "0"; const r = $(`<div style="display:flex;align-items:center;margin-bottom:2px"></div>`); r.appendChild(lab); r.insertAdjacentHTML("beforeend", tip(tipHtml)); w.appendChild(r); }
      else w.appendChild(lab);
      w.appendChild(el); return w;
    };

    async function renderContribution(d) {
      const role = (d.invited && d.invited.role === "sous_traitant") ? "sous-traitant" : "partenaire";
      const card = $(`<div class="card pad" style="margin-bottom:16px;border:1px solid var(--accent,#3b5bdb)"></div>`);
      card.appendChild($(`<div class="row" style="gap:8px;align-items:center"><span style="flex:1;min-width:0"><b style="font-size:13.5px">Ma contribution au dossier commun</b>${tip("Vous ne voyez que <b>vos</b> données ; le chef de file les assemble et l'IA les fusionne dans la réponse commune.")}</span></div>`));
      const status = $(`<span class="pill neutral" style="font-size:11px">Brouillon</span>`); card.firstChild.appendChild(status);
      card.appendChild($(`<div class="muted small" style="margin-top:4px">En tant que <b>${role}</b>, renseignez votre part.</div>`));
      card.appendChild($(`<div id="cv-contrib-warn"></div>`));   // rempli si la convention est générée (syncContribWarn)

      const company = inp("Votre entreprise"), lot = inp("Votre lot / périmètre (ex. Lot 2 — Démolition)");
      const siret = inp("SIRET (14 chiffres)"), forme = inp("Forme juridique (ex. SARL, SAS)");
      const adresse = inp("Adresse"), cp = inp("Code postal"), ville = inp("Ville");
      const quals = inp("Qualifications, séparées par des virgules (ex. Qualibat 1112, RGE)");
      const refs = ta("Vos références — une par ligne", 3);
      // Doctrine de visibilité : le PRIX DE VENTE du lot est en clair (le mandataire en a besoin) ;
      // le DÉTAIL du chiffrage (coûts, marges, méthode) est chiffré dans le navigateur (AdjugoCrypto).
      const CR = window.AdjugoCrypto || null;
      // DPGF de lot (vague 4) : composant créé plus bas ; texte du détail tel qu'enregistré
      // (savedTexte) et part telle que le chef de file la voit (savedMeta : nom, lot, prix).
      let dp = null, savedTexte = "", lastCollect = null;
      const savedMeta = { entreprise: "", lot: "", prix: null };
      const prix = inp("ex. 280000"); prix.type = "number"; prix.min = "0"; prix.step = "1"; prix.inputMode = "decimal";
      const DETAIL_PH = "Coûts, marges, méthode de calcul — pour vous seul";
      const detail = ta(DETAIL_PH, 4);
      const ca = inp("ex. 1850000"); ca.type = "number"; ca.min = "0"; ca.step = "1"; ca.inputMode = "decimal";
      const effectif = inp("ex. 14"); effectif.type = "number"; effectif.min = "0"; effectif.step = "1"; effectif.inputMode = "numeric";
      const repr = inp("Nom et prénom du représentant légal"), qualite = inp("Qualité (ex. Président, Gérante)");
      const memoire = ta("Votre savoir-faire sur ce lot, pour le dossier de présentation commun", 4);
      const note = ta("Un mot au chef de file (optionnel) — une question, une précision sur votre lot…", 2);
      const cNom = inp("Contact — nom"), cMail = inp("Email"), cTel = inp("Téléphone");
      card.appendChild(field("Entreprise", company));
      card.appendChild(field("Lot / périmètre", lot));
      // Identité juridique → alimente votre DC1/DC2 dans le dossier commun.
      const idr = document.createElement("div"); idr.className = "row wrap"; idr.style.gap = "8px";
      [siret, forme].forEach(el => { el.style.flex = "1"; el.style.minWidth = "140px"; idr.appendChild(el); });
      card.appendChild(field("Identité (pour vos formulaires officiels DC1, DC2)", idr));
      const adr = document.createElement("div"); adr.className = "row wrap"; adr.style.gap = "8px";
      adresse.style.flex = "2"; adresse.style.minWidth = "180px"; cp.style.width = "110px"; ville.style.flex = "1"; ville.style.minWidth = "120px";
      [adresse, cp, ville].forEach(el => adr.appendChild(el));
      card.appendChild(field("Adresse", adr));
      const sgr = document.createElement("div"); sgr.className = "row wrap"; sgr.style.gap = "8px";
      [repr, qualite].forEach(el => { el.style.flex = "1"; el.style.minWidth = "160px"; sgr.appendChild(el); });
      card.appendChild(field("Représentant légal et qualité du signataire", sgr));
      card.appendChild(field("Qualifications", quals));
      // Capacités déclarées par le partenaire lui-même (comptent dans le score du groupement).
      const capRow = document.createElement("div"); capRow.className = "row wrap"; capRow.style.gap = "8px";
      const caW = document.createElement("div"); caW.style.cssText = "flex:1;min-width:180px";
      caW.appendChild($(`<div class="muted small" style="margin-bottom:3px">Votre chiffre d'affaires (dernier exercice, € HT)</div>`)); caW.appendChild(ca);
      const efW = document.createElement("div"); efW.style.cssText = "width:130px";
      efW.appendChild($(`<div class="muted small" style="margin-bottom:3px">Effectif</div>`)); efW.appendChild(effectif);
      capRow.appendChild(caW); capRow.appendChild(efW);
      const capBox = document.createElement("div"); capBox.appendChild(capRow);
      // Seule la date de dernière déclaration reste visible (vide tant qu'il n'y en a pas).
      const capNote = $(`<div class="muted small" style="margin-top:4px"></div>`);
      capBox.appendChild(capNote);
      card.appendChild(field("Vos capacités", capBox, "Ces capacités comptent dans le score du groupement. Elles sont déclarées par vous."));
      card.appendChild(field("Références", refs));
      // Rédaction, vague 5 (E2) : vos marchés publics (DECP) et vos qualifications RGE (ADEME), lus avec le SIRET de
      // votre part ; ce que vous cochez s'ajoute à votre part (sources-publiques.js). La zone « une par ligne »
      // ne montre que l'intitulé : l'enregistrement garde l'acheteur, le montant et la provenance (curRefs).
      let curRefs = [];
      const refsNote = $(`<div class="muted small sp-refs-note"></div>`);
      const SPX = window.AdjugoSourcesPubliques || null;
      const syncRefsNote = () => { refsNote.textContent = SPX ? SPX._pur.spLibRefs(SPX._pur.spFusionRefs(refs.value, curRefs)) : ""; };
      refs.addEventListener("input", syncRefsNote);
      card.appendChild(refsNote);
      if (SPX) {
        const spHost = document.createElement("div"); spHost.className = "sp-host"; spHost.style.marginTop = "8px";
        card.appendChild(spHost);
        const base = "/api/invite/" + encodeURIComponent(TOKEN) + "/contribution";
        SPX.mount(spHost, { mode: "part", kinds: ["decp", "rge"],
          urls: { decp: base + "/publiques/marches", rge: base + "/publiques/rge", ecrire: base + "/reprendre" },
          // La saisie en cours est d'abord enregistrée (rien n'est perdu), puis le serveur ajoute ce qui est coché.
          avantEcrire: async () => { const ok = await save(); return ok ? { ok: true, version: curVer } : { ok: false, message: "Votre part n'a pas pu être enregistrée : rien n'a été ajouté." }; },

      let lignes = [], savedKey = "[]", locked = true, lockHint = "Lecture de vos lignes…", pieces = [], busy = false;
      const keyOf = (ls) => JSON.stringify((ls || []).map(l => [l.designation || "", l.unite || "", String(l.quantite == null ? "" : l.quantite), String(l.pu == null ? "" : l.pu)]));

      const fmt = (n) => n == null ? "—" : eurHT(n);

      let totEl = null, cmpEl = null, dirtyEl = null, rowsEl = null;
      function refreshTotals() {

        totEl.textContent = fmt(t);

      function rowEl(l, i) {

        const des = mk(l.designation, "ex. Fourniture et pose de tableaux", "Désignation"); des.maxLength = 300;

        if (locked) {
          const b = $(`<div class="g-banner" style="margin:12px 0 0"><i data-lucide="lock"></i><div class="small" style="flex:1">${esc(lockHint || "Vos lignes sont chiffrées : déverrouillez-les avec votre code de récupération.")}</div></div>`);

        body.appendChild($(`<div class="dp-head" aria-hidden="true"><span>Désignation</span><span>Unité</span><span class="dp-num">Quantité</span><span class="dp-num">Prix unitaire HT</span><span class="dp-num">Montant HT</span><span></span></div>`));

        const bDepo = $(`<button class="btn sm primary" type="button"><i data-lucide="file-check-2"></i>Relire et déposer le tableau de prix</button>`);
        const bCsv = $(`<button class="btn sm ghost" type="button"><i data-lucide="download"></i>Télécharger le fichier (CSV)</button>`);
        bSave.onclick = () => saveLines(bSave);
        bDepo.onclick = () => deposit(bDepo);
        bCsv.onclick = () => { const ch = check(); if (ch) { say(ch, true); return; } saveBlob(new Blob([D.csv(fileOpts())], { type: "text/csv;charset=utf-8" }), D.fileName(fileOpts())); okMsg(live, "Fichier téléchargé sur cet appareil (rien n'a été envoyé)."); };
        [bSave, bDepo, bCsv].forEach(b => acts.appendChild(b));
        dirtyEl = $(`<span class="small muted" style="display:none">${ico("pencil", 13, "margin-right:3px")}Modifications non enregistrées</span>`);
        acts.appendChild(dirtyEl);
        body.appendChild(acts);
        refreshTotals(); icons();
      }
      const clean = () => lignes.map(l => ({ designation: String(l.designation || "").trim(), unite: String(l.unite || "").trim(), quantite: D.parseNum(l.quantite), pu: D.parseNum(l.pu) }))
        .filter(l => l.designation || l.unite || l.quantite != null || l.pu != null);

      function check() {

        const errs = D.lineErrors(ls);
        if (errs.length) return errs.slice(0, 3).join(" ") + (errs.length > 3 ? " (et " + (errs.length - 3) + " autre" + (errs.length - 3 > 1 ? "s" : "") + ")" : "");
        return D.headerProblem(fileOpts());
      }
      async function saveLines(btn) {
        if (busy) return false;
        busy = true; if (btn) btn.disabled = true; say("Chiffrement et enregistrement de vos lignes…");
        try {
          const res = await api.save(clean());
          if (res && res.ok) { savedKey = keyOf(lignes); refreshTotals(); okMsg(live, "Lignes enregistrées, chiffrées dans votre navigateur."); return true; }
          say((res && res.err) || "Enregistrement impossible.", true); return false;
        } catch (e) { say("Chiffrement impossible : " + ((e && e.message) || "réessayez."), true); return false; }
        finally { busy = false; if (btn && btn.isConnected) btn.disabled = false; }
      }
      async function deposit(btn) {
        const ch = check(); if (ch) { say(ch, true); return; }
        if (dirty() && !(await saveLines(null))) return;
        const opts = fileOpts(), rows = D.rows(opts), t = D.total(opts.lignes), prix = api.meta().prix;
        const old = pieces.filter(p => p.piece_type === "dpgf_lot");

        const NUMC = { 0: 1, 3: 1, 4: 1, 5: 1 };
        const td = (c, j) => `<td class="${NUMC[j] ? "num" : j === 1 ? "des" : ""}" data-label="${esc(cols[j] || "")}">${esc(c)}</td>`;
        const tbl = `<div class="small" style="margin-top:10px">${esc(rows[0][0])}${metaRows.map(r => `<br>${esc(r[0])} : <b>${esc(r[1] || "")}</b>`).join("")}</div>`
          + `<div class="dp-prev" tabindex="0" role="region" aria-label="Aperçu du fichier"><table><thead><tr>${cols.map((c, j) => `<th scope="col" class="${NUMC[j] ? "num" : ""}">${esc(c)}</th>`).join("")}</tr></thead>`
          + `<tbody>${data.map(r => `<tr>${r.map(td).join("")}</tr>`).join("")}</tbody>`
          + `<tfoot><tr><td></td><td class="des" data-label=""><b>${esc(tot[1])}</b></td><td></td><td></td><td></td><td class="num" data-label=""><b>${esc(tot[5])}</b></td></tr></tfoot></table></div>`;

        const ok = await openModal({
          title: "Relire et déposer votre tableau de prix",
          bodyHtml: `<p style="margin:0">Voici <b>exactement</b> le fichier que recevra le chef de file, et lui seul : ${esc(D.fileName(opts))}.</p>${tbl}${ecart}`
            + (old.length ? `<p style="margin:10px 0 0">Il remplacera le tableau de prix déjà déposé (${esc(old.map(p => p.name).join(", "))}).</p>` : "")
            + `<p style="margin:10px 0 0" class="muted">Vos coûts, vos marges et votre méthode n'y figurent pas et restent chiffrés.</p>`,

      }
      function syncPill() {
        const dps = pieces.filter(p => p.piece_type === "dpgf_lot");
        if (dps.length) { const last = dps[dps.length - 1]; pill.className = "pill go"; pill.innerHTML = ICO_OK(12) + " Déposé" + (last.created_at ? " le " + esc(fmtShort(last.created_at)) : ""); pill.title = last.name || ""; }
        else { pill.className = "pill neutral"; pill.textContent = "Pas encore déposé"; pill.title = ""; }
        icons();
      }
      draw();
      return {
        el,
        load(d) { lignes = (d && Array.isArray(d.lignes) && d.lignes.length) ? d.lignes.map(l => ({ designation: l.designation || "", unite: l.unite || "", quantite: l.quantite == null ? "" : String(l.quantite).replace(".", ","), pu: l.pu == null ? "" : String(l.pu).replace(".", ",") })) : [blank()];
                  savedKey = keyOf(lignes); locked = false; lockHint = ""; draw(); },
        setLocked(on, hint) { locked = !!on; lockHint = hint || ""; draw(); },

        markSaved() { savedKey = keyOf(lignes); if (dirtyEl) dirtyEl.style.display = "none"; },
