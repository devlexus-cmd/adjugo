    }

    // ── Vérification d'identité par code (flux OTP existant) ──
    // Partagée par la soumission de la part et l'accord sur la convention. Si le lien cible une
    // adresse email et que l'email est configuré, l'invité prouve qu'il contrôle cette adresse
    // (code à 6 chiffres). opts.purpose : début de phrase de la modale (texte simple, échappé ici).
    async function verifyIdentity(msgEl, opts) {
      const o = opts || {};
      const otp = "/api/invite/" + encodeURIComponent(TOKEN) + "/otp/";
      const st = await fetch(otp + "status").then(r => r.ok ? r.json() : null).catch(() => null);
      if (!st || !st.required || st.verified) return true;
      let masked = st.email_masked || "votre adresse";
      // On ne redemande un code QUE s'il n'y en a pas déjà un valide en attente : sinon on
      // réutilise celui envoyé (rappeler /otp/request épuiserait la limite 6/h et bloquerait).
      const requestCode = async () => {
        const rq = await fetch(otp + "request", { method: "POST" }).then(r => r.ok ? r.json() : null).catch(() => null);
        if (rq && rq.email_masked) masked = rq.email_masked;
        return rq || { sent: false };
      };
      if (!st.pending) {
        msgEl.textContent = "Envoi d'un code de vérification…";
        const rq = await requestCode();
        if (!rq.sent) { msgEl.textContent = rq.reason || "Trop d'envois récents — patientez quelques minutes, puis ressaisissez le dernier code reçu."; return false; }
      }
      // Champ de saisie intégré (aux couleurs Adjugo) plutôt qu'un prompt système gris.
      let note = "";
      while (true) {
        const res = await openModal({
          title: "Vérifiez votre identité",
          bodyHtml: `${esc(o.purpose || "Pour continuer")}, saisissez le code à 6 chiffres envoyé à <b>${esc(masked)}</b>.`,
          inputLabel: "Code de vérification", withInput: true, noteHtml: note,
          confirmLabel: "Valider", cancelLabel: "Annuler", extraLabel: "Renvoyer le code",
        });
        if (!res) { msgEl.textContent = o.cancelMsg || "Vérification annulée."; return false; }
        if (res.extra) {   // « Renvoyer le code »
          const rq = await requestCode();
          note = rq.sent ? (rq.already ? "Le dernier code envoyé est encore valable : vérifiez vos emails, y compris les indésirables." : "Un nouveau code vient d'être envoyé.")
            : esc(rq.reason || "Envoi impossible pour le moment : réessayez dans quelques minutes.");
          continue;
        }
        const code = (res.value || "").trim();
        if (!code) { note = "Saisissez le code à 6 chiffres reçu par email."; continue; }
        const vr = await fetch(otp + "verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code }) }).catch(() => null);
        if (vr && vr.ok) { okMsg(msgEl, "Identité vérifiée"); return true; }
        const e = vr ? await vr.json().catch(() => ({})) : {};
        const txt = errText(e, vr ? "Code incorrect." : "Connexion impossible : réessayez.");
        if (vr && (vr.status === 400 || vr.status === 410)) { note = esc(txt); continue; }   // code faux / expiré : on reste dans la saisie
        msgEl.textContent = txt; return false;
      }
    }

    // ══════════ Convention de groupement (co-traitance v2, vague 2) ══════════
    // Contrat : docs/COTRAITANCE_V2_VAGUE2_API.md §4 et §7. Doctrine : en brouillon, le partenaire
    // ne voit QUE son propre prix (jamais le total ni le prix des autres) ; une fois générée, le
    // texte (annexe de répartition comprise) est le même pour tous. On n'affiche que ce que l'API
    // renvoie : aucun chiffre calculé ici, jamais d'email ni d'IP.
    // Le texte (content_md / apercu_md) n'est JAMAIS injecté en HTML : rendu DOM par textContent
    // (titres, paragraphes, listes, gras / italique, tableau de répartition).
    const CONV_URL = () => "/api/invite/" + encodeURIComponent(TOKEN) + "/convention";
    const CV_ACTIVE = { a_signer: 1, signee: 1 };
    const CV_PILL = { aucune: "neutral", draft: "neutral", a_signer: "st-envoye", signee: "go", perimee: "a_etudier" };
    const SIG_PILL = { signed: "go", hors_ligne: "go", pending: "neutral", perimee: "neutral" };
    const CV_LEGAL_DEFAULT = "Modèle à faire relire par un conseil (avocat, juriste, CCI) : ce n'est pas un conseil juridique.";
    const CV_ID_EMAIL = "accord enregistré via le lien, adresse email vérifiée par code";   // identity_label « email_verifie » (contrat §2)
    // form : nom / qualité saisis dans « Donner mon accord », conservés si la carte est redessinée (même texte).
    const CV = { el: null, data: null, alertEl: null, form: null };
    // Compte Adjugo ouvert dans ce navigateur : joint aux appels de la convention (le serveur ne
    // s'en sert que si c'est le compte qui a réclamé ce lien → niveau « compte vérifié »). Relu à
    // CHAQUE appel : la personne a pu se connecter dans un autre onglet entre-temps.
    const readMyToken = () => { try { return localStorage.getItem("adjugo_token") || null; } catch (e) { return null; } };
    const authHeaders = (extra) => { const h = Object.assign({}, extra || {}); MY_TOKEN = readMyToken(); if (MY_TOKEN) h.Authorization = "Bearer " + MY_TOKEN; return h; };
    // Connexion (ou déconnexion) faite dans un autre onglet : la carte est rechargée d'elle-même,
    // sans recharger la page (« compte requis » se lève dès le retour sur cet onglet).
    function cvTokenChanged() { if (readMyToken() !== MY_TOKEN && CV.el && CV.el.isConnected) loadConvention(); }
    window.addEventListener("storage", (e) => { if (!e || e.key === null || e.key === "adjugo_token") cvTokenChanged(); });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") cvTokenChanged(); });
    // Sous-traitant : ni membre du groupement, ni appelé à valider la convention (rôle donné par l'API).
    const isSousTraitant = () => String((DATA && DATA.invited && DATA.invited.role) || "").trim().toLowerCase().replace(/-/g, "_") === "sous_traitant";
    // Montant au format du texte de la convention : « 125 000 € HT » / « 125 000,50 € HT ».
    const eurHT = (n) => {
      if (n == null || n === "" || isNaN(Number(n))) return "—";
      const v = Number(n), dec = Math.abs(v - Math.trunc(v)) > 0.004;
      return v.toLocaleString("fr-FR", { minimumFractionDigits: dec ? 2 : 0, maximumFractionDigits: 2 }) + " € HT";
    };
    const norm = (s) => String(s || "").trim().toLowerCase();
    const isMyCompany = (name) => { const n = norm(name); return !!n && [MY_COMPANY, DATA && DATA.invited && DATA.invited.company].some(x => norm(x) === n); };

    // ── Rendu sûr du Markdown simple de la convention ──
    // Les valeurs saisies y sont échappées (\* \_ \` \\ \# \[ \]) : on les protège d'abord (caractères
    // privés), on applique **gras** / *italique*, puis on les restitue en texte littéral.
    const mdProtect = (s) => String(s == null ? "" : s).replace(/[\uE000-\uE0FF]/g, "").replace(/\\([\\*_`#\[\]])/g, (m, c) => String.fromCharCode(0xE000 + c.charCodeAt(0)));
    const mdRestore = (s) => String(s).replace(/[\uE000-\uE0FF]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xE000));
    function mdInline(parent, s) {
      String(s).split(/(\*\*[^*\n]+?\*\*|\*[^*\n]+?\*)/g).forEach(part => {
        if (!part) return;
        let node;
        if (part.length > 4 && part.startsWith("**") && part.endsWith("**")) { node = document.createElement("strong"); node.textContent = mdRestore(part.slice(2, -2)); }
        else if (part.length > 2 && part.startsWith("*") && part.endsWith("*")) { node = document.createElement("em"); node.textContent = mdRestore(part.slice(1, -1)); }
        else node = document.createTextNode(mdRestore(part));
        parent.appendChild(node);
      });
    }
    // Ligne d'annexe produite par le serveur : « - **Entreprise** — rôle — part : … — prix de vente : … ».
    const ANNEX_RE = /^- \*\*([^*]+)\*\* — (mandataire \(chef de file\)|co-traitant \(partenaire\)) — part : (.+) — prix de vente : (.+)$/;
    const ANNEX_COLS = ["Entreprise", "Rôle", "Part", "Prix de vente"];
    function mdTable() {
      const t = document.createElement("table"); t.className = "cv-tbl";
      const tr = document.createElement("tr");
      ANNEX_COLS.forEach((c, i) => { const th = document.createElement("th"); th.scope = "col"; th.textContent = c; if (i === 3) th.className = "num"; tr.appendChild(th); });
      const thead = document.createElement("thead"); thead.appendChild(tr); t.appendChild(thead);
      t.appendChild(document.createElement("tbody"));
      return t;
    }
    function mdRender(md, label) {
      const root = document.createElement("div"); root.className = "cv-doc"; root.tabIndex = 0;
      root.setAttribute("role", "region"); root.setAttribute("aria-label", label || "Texte de la convention");
      let ul = null, table = null, annex = false;
      String(md || "").replace(/\r/g, "").split("\n").forEach(raw => {
        const line = mdProtect(raw).replace(/\s+$/, "");
        if (!line.trim()) { ul = null; table = null; return; }
        let m = /^(#{1,3}) +(.*)$/.exec(line);
        if (m) {
          ul = null; table = null;
          const h = document.createElement(m[1].length === 1 ? "h3" : "h4"); mdInline(h, m[2]); root.appendChild(h);
          annex = /^annexe\b/i.test(mdRestore(m[2]).trim());
          return;
        }
        m = annex ? ANNEX_RE.exec(line) : null;
        if (m) {
          ul = null;
          if (!table) { table = mdTable(); root.appendChild(table); }
          const tr = document.createElement("tr");
          [m[1], m[2], m[3], m[4]].forEach((v, i) => { const td = document.createElement("td"); td.textContent = mdRestore(v).trim(); td.dataset.label = ANNEX_COLS[i]; if (i === 3) td.className = "num"; if (i === 0) td.style.fontWeight = "600"; tr.appendChild(td); });
          table.tBodies[0].appendChild(tr);
          return;
        }
        if (/^- /.test(line)) {
          table = null;
          if (!ul) { ul = document.createElement("ul"); root.appendChild(ul); }
          const li = document.createElement("li"); mdInline(li, line.slice(2)); ul.appendChild(li);
          return;
        }
        ul = null; table = null;
        const p = document.createElement("p"); mdInline(p, line);
        if (/^\*\*Total de l'offre commune/.test(line)) p.className = "cv-total";
        root.appendChild(p);
      });
      return root;
    }

    // ── Morceaux d'écran ──
    const cvLegal = (d) => $(`<div class="cv-legal">${ico("scale", 15)}<span>${esc((d && d.avertissement) || CV_LEGAL_DEFAULT)}</span></div>`);
    const cvWarn = (txt) => $(`<div class="warn-box"><i data-lucide="alert-triangle"></i><span>${esc(txt)}</span></div>`);
    function cvDetails(key, title, bodyEl) {
      const det = document.createElement("details"); det.className = "cv-read"; det.dataset.k = key;
      det.appendChild($(`<summary><span class="cv-chev" aria-hidden="true">${ico("chevron-right", 15)}</span><span>${esc(title)}</span></summary>`));
      det.appendChild(bodyEl);

    }
    function cvForme(d) {
      const dl = $(`<dl class="g-fact cv-fact"></dl>`);
      const add = (t, html) => { dl.appendChild($(`<dt>${esc(t)}</dt>`)); const dd = document.createElement("dd"); dd.innerHTML = html; dl.appendChild(dd); };
      const f = d.forme_label;
      // Terme juridique TOUJOURS accompagné de sa phrase simple (les deux viennent de l'API).
      if (f && f.terme) add("Forme du groupement", `<b>${esc(f.phrase || "")}</b> <span class="muted">· ${esc(f.terme)}</span>${tip(esc(f.explication || ""))}`);
      else add("Forme du groupement", `<span class="muted">Pas encore choisie par le chef de file</span>`);
      if (d.forme === "conjoint" && d.mandataire_solidaire) add("Chef de file", `<b>Le chef de file répond aussi de la part de chaque partenaire</b> <span class="muted">· Mandataire solidaire</span>`);

    }
    function cvRegles(d) {
      const hab = Array.isArray(d.habilitation) ? d.habilitation : [], params = Array.isArray(d.params) ? d.params : [];
      if (!hab.length && !params.length) return null;
      const box = $(`<div class="cv-box"></div>`);
      if (hab.length) {
        box.appendChild($(`<b>Le chef de file peut, au nom de tous :</b>`));
        const ul = document.createElement("ul");
        hab.forEach(h => ul.appendChild($(`<li>${esc(h.libelle || "")}${h.terme ? tip(esc(h.terme)) : ""}</li>`)));
        box.appendChild(ul);
      }
      if (params.length) {
        box.appendChild($(`<b style="display:block;margin-top:12px">Règles du groupement</b>`));
        const dl = $(`<dl class="g-fact cv-rules" style="margin-top:6px"></dl>`);
        params.forEach(p => { dl.appendChild($(`<dt>${esc(p.libelle || p.key || "")}</dt>`)); dl.appendChild($(`<dd>${esc(p.valeur_libelle || "—")}</dd>`)); });
        box.appendChild(dl);
      }
      return cvDetails("regles", "Pouvoirs du chef de file et règles du groupement", box);
    }
    // Répartition : en brouillon, SEUL le prix du partenaire (l'API n'envoie que le sien) ;
    // générée, tous les prix de vente + le total figé. Avertissement de la doctrine au bon moment.
    function cvRepartition(d, full) {
      const rows = Array.isArray(d.membres) ? d.membres : [];
      if (!rows.length) return null;
      const sec = $(`<div class="cv-sec"></div>`);
      sec.appendChild($(`<h3 class="cv-sec-t">Répartition des parts${tip(full
        ? "L'annexe de répartition est la même pour tous les membres : chacun y voit le prix de vente de chaque part et le total. Les coûts et les marges n'y figurent pas et restent confidentiels."
        : isSousTraitant() ? "Les membres du groupement et leur part. Les prix de vente n'apparaissent pas tant que la convention n'est pas générée. Les coûts et les marges n'y figurent jamais."
        : "Tant que la convention n'est pas générée, vous ne voyez que votre propre prix. Les coûts et les marges ne figurent jamais dans la convention.")}</h3>`));
      const t = $(`<table class="cv-tbl"><thead><tr><th scope="col">Entreprise</th><th scope="col">Rôle</th><th scope="col">Part</th><th scope="col" class="num">Prix de vente</th></tr></thead><tbody></tbody><tfoot></tfoot></table>`);
      const tb = t.tBodies[0];
      rows.forEach(m => {
        const lead = m.membre === "mandataire" || m.role === "mandataire";
        const hasPrice = Object.prototype.hasOwnProperty.call(m, "prix_lot_ht");
        const me = !lead && (full ? isMyCompany(m.company) : hasPrice);
        const prix = hasPrice ? (m.prix_lot_ht == null ? "pas encore renseigné" : eurHT(m.prix_lot_ht)) : "affiché à la génération";
        const tr = $(`<tr${me ? ' class="cv-me"' : ""}><td data-label="Entreprise"><span><b>${esc(m.company || (lead ? "Chef de file" : "Partenaire"))}</b>${me ? ' <span class="muted">(vous)</span>' : ""}</span></td><td data-label="Rôle">${lead ? "chef de file" : "partenaire"}</td><td data-label="Part">${esc(m.lot || "à préciser")}</td><td data-label="Prix de vente" class="num${hasPrice ? "" : " muted"}">${esc(prix)}</td></tr>`);
        tb.appendChild(tr);
      });
      const tot = full ? (d.total_offre_ht != null ? eurHT(d.total_offre_ht) : "—") : "révélé à tous à la génération";
      t.tFoot.appendChild($(`<tr><td class="cv-tot-l" colspan="3">Total de l'offre commune</td><td class="num${full ? "" : " muted"}" data-label="Total de l'offre commune">${esc(tot)}</td></tr>`));
      const wrap = document.createElement("div"); wrap.appendChild(t); sec.appendChild(wrap);
      const two = full ? !!d.warning_two_members : rows.length === 2;
      if (!full) { if (!isSousTraitant()) sec.appendChild(cvWarn("À la génération, chaque membre verra le prix de chaque part, le vôtre compris, et le total de l'offre." + (two ? " À deux membres, le total révèle à chacun la part de l'autre." : ""))); }
      else if (two) sec.appendChild(cvWarn("À deux membres, le total révèle à chacun la part de l'autre."));
      return sec;
    }
    function cvAccords(d) {
      const sigs = Array.isArray(d.signatures) ? d.signatures : [];
      if (!sigs.length) return null;
      const ms = d.ma_signature || {};
      const sec = $(`<div class="cv-sec"></div>`);
      const nA = d.n_accords != null ? d.n_accords : sigs.filter(s => s.status === "signed" || s.status === "hors_ligne").length;
      const nS = d.n_signataires != null ? d.n_signataires : sigs.length;
      sec.appendChild($(`<h3 class="cv-sec-t">Accords des membres <span class="pill neutral" style="font-size:11px;margin-left:4px">${esc(nA)} sur ${esc(nS)}</span>${tip("Chaque accord est enregistré avec la date, l'empreinte du texte et le niveau d'identité de la personne. Ni adresse email ni adresse IP n'apparaissent ici.")}</h3>`));
      const ul = $(`<ul class="cv-sigs"></ul>`);
      sigs.forEach(s => {
        const lead = s.membre === "mandataire";
        const mineSigned = ms.status === "signed" && s.status === "signed" && s.signed_at && s.signed_at === ms.signed_at;
        const me = !lead && (mineSigned || isMyCompany(s.company));
        const li = $(`<li><div class="cv-sig-h"><b>${esc(s.company || (lead ? "Chef de file" : "Partenaire"))}</b><span class="muted">· ${lead ? "chef de file" : "partenaire"}</span>${me ? '<span class="muted">(vous)</span>' : ""}<span class="pill ${SIG_PILL[s.status] || "neutral"}" style="font-size:10.5px">${esc(s.status_label || s.status || "")}</span></div></li>`);

          if (bits.length) li.appendChild($(`<div class="cv-sig-d">${esc(bits.join(" · "))}</div>`));

    }
    // Téléchargement du PDF (texte figé + accords) : fetch → fichier, pour afficher une erreur
    // lisible au lieu d'une page JSON (409 tant que la convention n'est pas générée, 429…).
    async function cvDownloadPdf(btn, live, version) {
      btn.disabled = true; live.classList.remove("err"); live.textContent = "Préparation du PDF…";
      try {
        const r = await fetch(CONV_URL() + "/pdf");
        if (!r.ok) {
          const e = await r.json().catch(() => ({}));
          live.classList.add("err"); live.textContent = errText(e, r.status === 429 ? "Trop de téléchargements : réessayez dans une minute." : "Téléchargement impossible pour le moment.");
          return;
        }
        const blob = await r.blob();
        const cd = r.headers.get("content-disposition") || "";
        let name = "Convention_groupement" + (version ? "_v" + version : "") + ".pdf";
        const m1 = /filename\*=UTF-8''([^;]+)/i.exec(cd), m2 = /filename="?([^";]+)"?/i.exec(cd);
        try { if (m1) name = decodeURIComponent(m1[1]); else if (m2) name = m2[1]; } catch (e) {}
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a"); a.href = url; a.download = name; a.rel = "noopener"; a.style.display = "none";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        okMsg(live, "PDF téléchargé");
        if (RELOAD_JOURNAL) RELOAD_JOURNAL();   // « Vous avez téléchargé la convention »
      } catch (e) { live.classList.add("err"); live.textContent = "Téléchargement impossible : vérifiez votre connexion."; }
      finally { btn.disabled = false; }
    }
    // Zone « Mon accord » : déjà donné / à donner / compte requis / non signataire.
    function cvAccordBox(d, flash) {
      const ms = d.ma_signature || {}, st = d.status;
      const box = $(`<div class="cv-accord" id="cv-accord"></div>`);
      const live = $(`<div class="cv-msg" role="status" aria-live="polite" style="margin-top:10px"></div>`);
      const say = (t, err) => { live.classList.toggle("err", !!err); live.textContent = t || ""; };
      const sayFlash = () => { if (flash) { say(flash.text, flash.err); flash.shown = true; } };
      if (!ms.signataire) {
        if (st !== "a_signer") return null;
        box.className = "cv-accord plain";
        box.appendChild($(`<div class="small cv-okline">${ico("info", 16, "color:var(--text-2,#6b7280)")}<span>${esc(d.message || "Vous n'êtes pas signataire de cette convention.")}</span></div>`));
        box.appendChild(live); sayFlash();
        return box;
      }
      if (ms.status === "signed") {
        box.classList.add("ok");
        // Niveau réellement imprimé dans le PDF : celui de MA ligne d'accord (même date, même nom).
        const sig = (d.signatures || []).find(s => s.status === "signed" && s.signed_at && s.signed_at === ms.signed_at);
        const lab = (sig && sig.identity_label) || ms.identite_libelle || "";
        box.appendChild($(`<div class="cv-okline" tabindex="-1">${ico("check-circle-2", 18, "color:var(--success-text,#1a7f4b);margin-top:1px")}<div><b>Accord enregistré${ms.signed_at ? " le " + esc(fmtDT(ms.signed_at)) : ""}</b>${lab ? `<div class="small muted" style="margin-top:2px">${esc(lab)}</div>` : ""}</div></div>`));
        box.appendChild(live); sayFlash();
        return box;
      }
      if (st !== "a_signer" || !ms.peut_valider) return null;
      box.appendChild($(`<h3 class="cv-sec-t">Donner mon accord${tip("Votre accord porte sur ce texte précis (son empreinte). Si le texte change, un nouvel accord vous sera demandé.")}</h3>`));
      if ((d.version || 0) > 1) box.appendChild($(`<div class="small" style="margin-top:4px">Nouvelle version n°<b>${esc(d.version)}</b> : le chef de file a régénéré la convention. Relisez-la avant de donner votre accord.</div>`));
      if (ms.compte_requis) {
        box.appendChild($(`<div class="small" style="margin-top:8px">Ce dossier est rattaché à un compte Adjugo : connectez-vous avec ce compte, puis revenez sur cette page pour donner votre accord.${tip("La connexion s'ouvre dans un nouvel onglet. Cette page se met à jour d'elle-même quand vous y revenez.")}</div>`));
        const acts = $(`<div class="cv-actions"></div>`);
        acts.appendChild($(`<a class="btn sm primary" href="/app?shared=${esc(encodeURIComponent(TOKEN))}" target="_blank" rel="noopener"><i data-lucide="log-in"></i>Me connecter</a>`));
        box.appendChild(acts); box.appendChild(live); box.appendChild(cvLegal(d)); sayFlash();
        return box;
      }
      const uid = "cv" + (d.version || 0);
      const keep = (CV.form && CV.form.hash === d.content_hash) ? CV.form : null;
      const form = $(`<div class="cv-form"></div>`);
      const nW = $(`<div><label for="${uid}-nom">Nom et prénom de la personne qui donne l'accord</label></div>`);
      const nIn = inp("ex. Jean Le Gall", keep ? keep.nom : ms.signataire_nom); nIn.id = uid + "-nom"; nIn.autocomplete = "name"; nIn.maxLength = 255; nW.appendChild(nIn);
      const qW = $(`<div><label for="${uid}-qual">Qualité</label></div>`);
      const qIn = inp("ex. Gérant, Présidente", keep ? keep.qual : ms.signataire_qualite); qIn.id = uid + "-qual"; qIn.autocomplete = "organization-title"; qIn.maxLength = 120; qW.appendChild(qIn);
      const remember = () => { CV.form = { hash: d.content_hash, nom: nIn.value, qual: qIn.value }; };
      nIn.addEventListener("input", remember); qIn.addEventListener("input", remember);
      form.appendChild(nW); form.appendChild(qW); box.appendChild(form);
      const chkW = $(`<label class="cv-check" for="${uid}-ok"><input type="checkbox" id="${uid}-ok"><span>J'ai lu la convention et je donne mon accord</span></label>`);
      const chk = chkW.querySelector("input");
      box.appendChild(chkW);
      const acts = $(`<div class="cv-actions"></div>`);
      const btn = $(`<button class="btn primary" type="button"><i data-lucide="check"></i>Donner mon accord</button>`);
      acts.appendChild(btn); box.appendChild(acts); box.appendChild(live);
      // Ce qui sera imprimé dans le PDF, la nature de l'accord, l'avertissement : visibles ici.
      // Code exigé : l'accord ne peut être donné qu'après vérification → niveau « email vérifié ».
      const idLab = ms.verification_requise ? CV_ID_EMAIL : (ms.identite_libelle || "");
      box.appendChild($(`<div class="cv-note">${ico("fingerprint", 14)}<span>Niveau d'identité imprimé dans le PDF : <b>${esc(idLab)}</b>.${ms.verification_requise ? " Vous recevrez d'abord un code à 6 chiffres par email pour vérifier votre adresse." : ""}</span></div>`));
      if (d.nature_accord) box.appendChild($(`<div class="cv-note">${ico("stamp", 14)}<span>${esc(d.nature_accord)}</span></div>`));
      box.appendChild(cvLegal(d)); sayFlash();
      btn.onclick = async () => {
        const nom = nIn.value.trim(), qual = qIn.value.trim();
        if (!nom) { say("Indiquez le nom de la personne qui donne l'accord.", true); nIn.focus(); return; }
        if (!chk.checked) { say("Cochez « J'ai lu la convention et je donne mon accord ».", true); chk.focus(); return; }
        btn.disabled = true; say("Enregistrement de votre accord…");
        const body = JSON.stringify({ content_hash: d.content_hash || "", signataire_nom: nom, signataire_qualite: qual, accepte: true });
        const post = () => fetch(CONV_URL() + "/valider", { method: "POST", headers: authHeaders({ "Content-Type": "application/json" }), body }).catch(() => null);
        let r = await post();
        // Identité à prouver : flux OTP existant (code par email), puis NOUVEL ESSAI automatique.
        if (r && r.status === 403) {
          const e = await r.clone().json().catch(() => ({}));
          if (e && e.detail && e.detail.code === "identity_unverified") {
            const ok = await verifyIdentity(live, { purpose: "Pour enregistrer votre accord sur la convention", cancelMsg: "Vérification annulée : votre accord n'est pas enregistré." });
            if (!ok) { live.classList.add("err"); btn.disabled = false; return; }
            say("Enregistrement de votre accord…");
            r = await post();
          }
        }
        if (r && r.ok) {
          const nd = await r.json().catch(() => null);
          if (nd) renderConvention(nd, { text: "Votre accord est enregistré.", focus: true }); else loadConvention({ text: "Votre accord est enregistré.", focus: true });
          if (RELOAD_JOURNAL) RELOAD_JOURNAL();
          return;
        }
        const e = r ? await r.json().catch(() => ({})) : {};
        const code = e && e.detail && e.detail.code;
        const txt = errText(e, !r ? "Connexion impossible : réessayez." : r.status === 429 ? "Trop de tentatives : réessayez dans quelques minutes." : "Accord impossible pour le moment.");
        // Texte changé, convention plus à jour, compte requis… : on recharge l'état réel et on explique.
        if (["texte_modifie", "perimee", "pas_generee", "statut", "compte_requis", "pas_signataire"].indexOf(code) >= 0) { loadConvention({ text: txt, err: true }); return; }
        btn.disabled = false; say(txt, true);
      };
      return box;
    }

    // ── Carte complète ──
    function renderConvention(d, flash) {
      const el = CV.el; if (!el || !el.isConnected) return;
      CV.data = d;
      const openKeys = Array.from(el.querySelectorAll("details[open]")).map(x => x.dataset.k);
      const textShown = el.dataset.cvText || "";   // version du texte déjà affichée (repli choisi par la personne respecté)
      el.innerHTML = "";
      const st = d.status || "aucune", ms = d.ma_signature || {};
      const full = !!d.content_md && (!!CV_ACTIVE[st] || st === "perimee");
      const head = $(`<div class="cv-head"></div>`);
      head.appendChild($(`<h2 class="cv-title" id="cv-title" tabindex="-1">Convention de groupement</h2>`));
      head.insertAdjacentHTML("beforeend", tip("Le texte qui organise le groupement : sa forme, les pouvoirs du chef de file, la part et le prix de chacun. Le chef de file la prépare puis la génère ; chaque membre donne ensuite son accord depuis son espace."));
      head.appendChild($(`<span class="pill ${CV_PILL[st] || "neutral"}" style="font-size:11px">${esc(d.status_label || st)}</span>`));
      head.appendChild($(`<span style="flex:1"></span>`));
      const rf = $(`<button class="btn sm" type="button"><i data-lucide="refresh-cw"></i>Actualiser</button>`);
      rf.onclick = async () => { rf.disabled = true; await loadConvention(); };
      head.appendChild(rf);
      el.appendChild(head);
      const cardMsg = $(`<div class="cv-msg" role="status" aria-live="polite" style="margin-top:8px"></div>`);
      const finish = () => {
        el.appendChild(cardMsg);
        if (flash && !flash.shown) { cardMsg.classList.toggle("err", !!flash.err); cardMsg.textContent = flash.text || ""; }
        el.querySelectorAll("details").forEach(x => { if (openKeys.indexOf(x.dataset.k) >= 0) x.open = true; });
        const tx = el.querySelector('details[data-k="texte"]');
        if (tx) { const v = String(d.version || 0); if (textShown !== v && ms.peut_valider) tx.open = true; el.dataset.cvText = v; }
        icons(); syncConvAlert(); syncContribWarn();
        if (flash && flash.focus) { const t = el.querySelector("#cv-accord .cv-okline") || el.querySelector("#cv-title"); if (t) t.focus(); }
      };

      if (st === "aucune") {
        el.appendChild($(`<p class="cv-lead">${esc(d.message || "Le chef de file n'a pas encore préparé la convention de groupement.")} Vous la retrouverez ici dès qu'elle sera prête.</p>`));
        return finish();
      }
      const sousT = isSousTraitant();
      if (st === "perimee") el.appendChild(cvWarn("La convention n'est plus à jour : une part, un prix ou la composition a changé. Le chef de file va la régénérer" + (sousT ? "." : " ; vous donnerez alors votre accord sur la nouvelle version.")));
      if (st === "signee") el.appendChild($(`<div class="cv-ok-banner">${ico("check-circle-2", 16)}<span><b>Validée par tous les membres.</b> Le PDF reprend le texte et la liste des accords enregistrés.</span></div>`));
      if (!full) el.appendChild($(`<p class="cv-lead">${sousT ? "Vous intervenez en sous-traitance : vous n'êtes pas membre du groupement et n'avez pas à valider la convention." : "Le chef de file prépare la convention. Vous pourrez donner votre accord dès qu'il l'aura générée."}</p>`));
      else {
        const meta = $(`<div class="cv-meta"></div>`);
        meta.appendChild($(`<span>Version n°<b>${esc(d.version || 0)}</b></span>`));
        if (d.frozen_at) meta.appendChild($(`<span>Générée le <b>${esc(fmtShort(d.frozen_at))}</b></span>`));
        if (d.content_hash) {
          const hw = $(`<span class="cv-hashw">Empreinte <code class="cv-hash">${esc(String(d.content_hash).slice(0, 12))}</code></span>`);
          hw.insertAdjacentHTML("beforeend", tip(`L'empreinte identifie ce texte exact : c'est la même pour tous les membres, et elle change si un seul caractère change. Elle est imprimée dans le PDF.<span class="cv-hashfull">${esc(d.content_hash)}</span>`, true));
          meta.appendChild(hw);
        }
        el.appendChild(meta);
      }
      // Avertissement « modèle à faire relire » : dans la zone d'accord quand on peut valider, sinon ici.
      const legalInBox = st === "a_signer" && ms.peut_valider && ms.signataire && ms.status !== "signed";
      if (!legalInBox) el.appendChild(cvLegal(d));
      el.appendChild(cvForme(d));
      // Caduque : l'ancienne répartition est dans l'annexe de l'ancien texte (même empreinte). On
      // ne la redessine pas à partir des données du moment, qui ont pu changer depuis (et n'ont
      // jamais figuré dans une convention générée).
      const rep = (st === "perimee" && full) ? null : cvRepartition(d, full); if (rep) el.appendChild(rep);
      const rg = cvRegles(d); if (rg) el.appendChild(rg);
      if (full) {
        const title = st === "perimee" ? "Relire l'ancien texte (version n°" + (d.version || 0) + ", plus à jour)" : "Lire le texte complet de la convention";
        el.appendChild(cvDetails("texte", title, mdRender(d.content_md, "Texte de la convention, version " + (d.version || 0))));
        const acts = $(`<div class="cv-actions"></div>`);
        const pdf = $(`<button class="btn sm" type="button"><i data-lucide="file-down"></i>Télécharger le PDF</button>`);
        const pLive = $(`<span class="cv-msg" role="status" aria-live="polite"></span>`);
        pdf.onclick = () => cvDownloadPdf(pdf, pLive, d.version);
        acts.appendChild(pdf); acts.appendChild(pLive); el.appendChild(acts);
      } else if (d.apercu_md) {
        el.appendChild(cvDetails("apercu", "Aperçu du texte (brouillon)", mdRender(d.apercu_md, "Aperçu du texte de la convention (brouillon)")));
      }
      let box = null;
      if (CV_ACTIVE[st]) {
        box = cvAccordBox(d, flash); if (box) el.appendChild(box);
        const acc = cvAccords(d); if (acc) el.appendChild(acc);
      }
      finish();
    }
    function renderConvUnavailable(el, r) {
      el.innerHTML = "";
      el.appendChild($(`<div class="cv-head"><h2 class="cv-title" id="cv-title" tabindex="-1">Convention de groupement</h2></div>`));
      const gone = r && (r.status === 404 || r.status === 410);
      const p = $(`<div class="cv-actions"><span class="muted small" style="flex:1;min-width:180px">${gone ? "Ce lien ne donne plus accès à la convention." : "Convention indisponible pour le moment."}</span></div>`);
      if (!gone) { const b = $(`<button class="btn sm" type="button"><i data-lucide="refresh-cw"></i>Réessayer</button>`); b.onclick = () => { b.disabled = true; loadConvention(); }; p.appendChild(b); }
      el.appendChild(p); icons();
    }
    async function loadConvention(flash) {
      const el = CV.el; if (!el) return;
      let r = null, d = null;
      try { r = await fetch(CONV_URL(), { headers: authHeaders() }); if (r.ok) d = await r.json(); } catch (e) {}
      if (CV.el !== el || !el.isConnected) return;   // la page a été redessinée entre-temps
      if (!d) { CV.data = null; renderConvUnavailable(el, r); syncConvAlert(); syncContribWarn(); return; }
      renderConvention(d, flash);
    }
    // Badge « Convention à valider » en tête du dossier (si MON accord est attendu).
    function syncConvAlert() {
      const a = CV.alertEl; if (!a || !a.isConnected) return;
      a.innerHTML = "";
      const d = CV.data, ms = (d && d.ma_signature) || {};
      if (!(d && d.status === "a_signer" && ms.peut_valider)) return;
      const row = $(`<div class="cv-alert"><span class="pill go_groupement" style="font-size:11px">Convention à valider</span><span class="small" style="flex:1;min-width:170px">Le chef de file a généré la convention : relisez-la et donnez votre accord.</span></div>`);
      const b = $(`<button class="btn sm primary" type="button">Voir la convention</button>`);
      b.onclick = () => { if (!CV.el) return; CV.el.scrollIntoView({ behavior: "smooth", block: "start" }); const t = CV.el.querySelector("#cv-title"); if (t) setTimeout(() => t.focus({ preventScroll: true }), 300); };
      row.appendChild(b); a.appendChild(row);
    }
    // Convention générée : modifier SA part la rend caduque (doctrine « avertir, pas bloquer »).
    const cvPartLocksConvention = () => { const d = CV.data, ms = (d && d.ma_signature) || {}; return !!(d && CV_ACTIVE[d.status] && ms.signataire); };
    function syncContribWarn() {
      const w = document.getElementById("cv-contrib-warn"); if (!w) return;
      w.innerHTML = "";
      if (cvPartLocksConvention()) { w.appendChild(cvWarn("La convention est générée : si vous modifiez votre part (enregistrement, pièce ajoutée, modifiée ou retirée), elle ne sera plus à jour. Le chef de file devra la régénérer et chaque membre redonner son accord.")); icons(); }
    }
    async function confirmPartChange() {
      if (!cvPartLocksConvention()) return true;
      return !!(await openModal({ title: "Modifier votre part ?", bodyHtml: "La convention de groupement est déjà générée. Si vous modifiez votre part, elle <b>ne sera plus à jour</b> : le chef de file devra la régénérer et chaque membre redonner son accord.", confirmLabel: "Modifier ma part", cancelLabel: "Annuler" }));
    }

    // ── Vue : Sourcing IA / Veille AO (découverte, lecture seule) ──
    function renderSourcing() {
      const root = content(); root.innerHTML = "";
      const bar = $(`<div class="card pad" style="margin-bottom:12px"></div>`);
      const q = inp("Mots-clés (ex. toiture, voirie, informatique)"); q.style.flex = "1"; q.style.minWidth = "200px";
      const dep = inp("Département (ex. 56)"); dep.style.width = "150px";
      const btn = $(`<button class="btn primary"><i data-lucide="search"></i>Rechercher</button>`);
      const row = document.createElement("div"); row.className = "row wrap"; row.style.gap = "8px";
      row.appendChild(q); row.appendChild(dep); row.appendChild(btn);
      bar.appendChild($(`<div style="margin-bottom:10px"><b style="font-size:13.5px">Trouvez des marchés publics</b>${tip("Sources officielles en direct (BOAMP, TED…). En tant qu'invité, la recherche est ouverte ; pour <b>analyser</b> ou <b>répondre</b>, créez votre compte.")}</div>`));
      bar.appendChild(row);
      root.appendChild(bar);
      const results = document.createElement("div"); root.appendChild(results);

      async function search() {
        results.innerHTML = `<div class="g-state"><div class="spin" style="margin:0 auto 10px"></div>Recherche en cours…</div>`;
        let d;
        try {
          d = await fetch("/api/invite/" + encodeURIComponent(TOKEN) + "/search", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ query: q.value, departements: dep.value ? [dep.value.trim()] : [], countries: ["FR"], limit: 20 }) }).then(r => r.ok ? r.json() : Promise.reject());
        } catch (e) { results.innerHTML = `<div class="muted small" style="padding:14px">Recherche indisponible. Réessayez.</div>`; return; }
        if (!d.tenders.length) { results.innerHTML = `<div class="muted small" style="padding:14px">Aucun marché trouvé. Élargissez les mots-clés.</div>`; return; }
        results.innerHTML = `<div class="muted small" style="margin:2px 0 6px">${esc(d.count)} résultat(s)</div>`;
        d.tenders.forEach(t => {
          const card = $(`<div class="g-res"></div>`);
          card.appendChild($(`<div style="font-weight:700;font-size:14px">${esc(t.objet || "Marché")}</div>`));
          const meta = [t.acheteur, t.lieu, t.montant_estime ? eur(t.montant_estime) : "", t.date_limite ? "limite " + fmtDate(t.date_limite) : ""].filter(Boolean).map(esc).join(" · ");
          card.appendChild($(`<div class="muted small" style="margin-top:3px">${meta}</div>`));
          const acts = $(`<div class="row" style="gap:8px;margin-top:9px"></div>`);
          const avisUrl = safeUrl(t.url || (t.provenance && t.provenance.source_url));
          if (avisUrl !== "#") acts.appendChild($(`<a class="btn sm" href="${esc(avisUrl)}" target="_blank" rel="noopener noreferrer nofollow">Voir l'avis<i data-lucide="external-link"></i></a>`));
          const ana = $(`<button class="btn sm primary">Analyser ce marché</button>`);
          ana.onclick = () => { const b = document.getElementById("g-banner"); b.style.background = "var(--accent-weak,#eef2ff)"; b.style.borderColor = "var(--accent,#3b5bdb)"; b.innerHTML = '<i data-lucide="sparkles"></i><div class="small">L\'analyse de pertinence, le chiffrage et la génération du dossier sont réservés aux comptes Adjugo. <a href="/app?inscription" target="_blank" rel="noopener"><b>Commencez votre essai gratuit de 30 jours</b>' + ico("arrow-right", 13, "margin-left:3px") + '</a></div>'; icons(); window.scrollTo({ top: 0, behavior: "smooth" }); };
          acts.appendChild(ana); card.appendChild(acts); results.appendChild(card);
        });
        icons();
      }
      btn.onclick = search; q.addEventListener("keyup", e => { if (e.key === "Enter") search(); });
      icons();
    }

    // Suggestion d'interface « publiez votre profil partenaire » renvoyée par le rattachement : transmise à
    // l'app (/app la lit une fois puis l'efface). Seuls titre et message, affichés en texte.
    function keepSuggestion(res) {
      const s = res && res.suggest_profile;
      if (!s || s.code !== "publier_profil_reseau") return;
      try { sessionStorage.setItem("adjugo_suggest_profile", JSON.stringify({ code: s.code, titre: String(s.titre || ""), message: String(s.message || "") })); } catch (e) {}
    }
    // Rattacher le lien à un compte : quand son espace privé de rédaction est ouvert dans CE navigateur, sa clé prouve
    // qu'on le détient (sinon 409 « espace_a_prouver » : le lien a servi à rédiger ailleurs).
    function claimHeaders(tok) {
      const h = { Authorization: "Bearer " + tok };
      try { const k = localStorage.getItem("adjugo_espace_" + TOKEN); if (k) h["X-Adjugo-Espace"] = k; } catch (e) {}
      return h;
    }
    // « Accepter depuis mon compte » (aperçu minimal d'une invitation du réseau).
    async function claimAndOpen(btn, live) {
      btn.disabled = true; btn.setAttribute("aria-busy", "true"); live.textContent = "Acceptation en cours…";
      try {
        const r = await fetch("/api/invite/" + encodeURIComponent(TOKEN) + "/claim", { method: "POST", headers: claimHeaders(MY_TOKEN) });
        if (r.ok) { keepSuggestion(await r.json().catch(() => null)); live.textContent = "Invitation acceptée : ouverture du dossier…"; location.href = "/app?shared=" + encodeURIComponent(TOKEN); return; }
        const e = await r.json().catch(() => ({}));
        live.textContent = errText(e, "Acceptation impossible pour le moment.");
      } catch (e) { live.textContent = "Erreur réseau : réessayez dans un instant."; }
      btn.disabled = false; btn.removeAttribute("aria-busy");
    }

    // ── Boot ──
    function finalScreen(icon, title, msg) {
      document.getElementById("shell").style.display = "none";
      const l = document.getElementById("loading"); l.style.display = "";
      l.innerHTML = `<div style="margin-bottom:8px;color:var(--text-2,#6b7280)">${ico(icon || "lock", 34)}</div><div style="font-weight:700;font-size:16px;color:var(--text,#16181d)">${esc(title)}</div><div style="margin-top:6px">${esc(msg)}</div>`;
      icons();
    }
    function fail(title, msg, icon) { finalScreen(icon, title, msg); }
    // L'invitation n'occupe plus un bandeau : elle passe dans la bulle (i) à côté du titre de page
    // (le bouton « Créer mon compte Adjugo » est déjà dans l'en-tête). #g-banner reste pour les
    // messages ponctuels (part soumise, analyse réservée, compte existant) et se masque s'il est vide.
    function setBanner() {
      document.getElementById("g-banner").innerHTML = "";
      document.getElementById("g-tip").innerHTML = tip("Vous êtes invité par " + (DATA.mandataire ? "<b>" + esc(DATA.mandataire) + "</b>" : "le chef de file") + " sur ce dossier. Créez votre compte Adjugo pour débloquer tout l'espace.");
    }
    function initials(s) { return (s || "CO").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase(); }

    document.querySelectorAll(".nav-item").forEach(a => {
      if (!a.dataset.allowed) a.classList.add("g-locked");
      a.addEventListener("click", () => nav(a.dataset.view, a.textContent.trim()));
    });
    // « Projets à venir » : masqué tant que le serveur ne l'active pas (PROJETS_A_VENIR=1).
    fetch("/api/public-config").then(r => r.ok ? r.json() : null).then(c => {
      const el = document.getElementById("nav-amont");
      if (el && c && c.projets_a_venir === true) el.style.display = "";
    }).catch(() => {});

    fetch("/api/invite/" + encodeURIComponent(TOKEN))
      .then(async r => {
        if (r.status === 410) {   // décliné OU expiré : distingués par le `detail` renvoyé
          const e = await r.json().catch(() => ({})); const dt = (e && typeof e.detail === "string") ? e.detail : "";
          if (/déclin/i.test(dt)) throw { icon: "hand", t: "Vous avez décliné cette invitation", m: dt };
          throw { icon: "link-2-off", t: "Lien expiré", m: dt || "Ce lien de partage a expiré." };
        }
        if (!r.ok) throw { icon: "link-2-off", t: "Lien invalide", m: "Ce lien n'est plus valable ou a été révoqué." }; return r.json(); })
      .then(d => {
        DATA = d;
        const co = (d.invited && d.invited.company) || "Partenaire";
        document.getElementById("g-name").textContent = co;
        document.getElementById("g-av").textContent = initials(co);
        // Rôle exact : le partenaire PEUT contribuer par défaut → ne plus afficher « lecture seule »
        // à tort (il a un formulaire d'écriture juste à côté). On distingue aussi partenaire et sous-traitant.
        const _role = (d.invited && d.invited.role === "sous_traitant") ? "Sous-traitant invité" : "Partenaire invité";
        document.getElementById("g-role").textContent = d.can_contribute ? _role : _role + " · lecture seule";
        document.getElementById("brand-sub").textContent = d.mandataire || "Espace partenaire";
        document.getElementById("loading").style.display = "none";
        document.getElementById("shell").style.display = "";
        setBanner();
        // Si la personne a DÉJÀ un compte Adjugo : lui proposer d'ouvrir le dossier
        // dans SON espace (compte-à-compte) plutôt que de rester en invité bridé.
        let myToken = null; try { myToken = localStorage.getItem("adjugo_token"); } catch (e) {}
        MY_TOKEN = myToken || null;
        if (myToken) {
          const b = document.getElementById("g-banner");
          // Aperçu minimal (invitation du réseau) : le bouton « Accepter depuis mon compte » du dossier fait
          // la même chose → pas de bandeau en double (le bouton reste disponible pour le coffre-fort).
          if (!d.apercu_minimal) {
            b.style.background = "var(--accent-weak,#eef2ff)"; b.style.borderColor = "var(--accent,#3b5bdb)";
            b.innerHTML = '<i data-lucide="user-check"></i><div class="small" style="flex:1">Vous avez un compte Adjugo : <b>ouvrez ce dossier dans votre espace</b>.</div>';
          }
          const btn = document.createElement("button"); btn.className = "btn sm primary"; btn.style.flex = "none"; btn.textContent = "Ouvrir dans mon Adjugo";
          CLAIM_BTN = btn;
          btn.onclick = async () => {
            btn.disabled = true; btn.textContent = "Ouverture…";
            try { const r = await fetch("/api/invite/" + encodeURIComponent(TOKEN) + "/claim", { method: "POST", headers: claimHeaders(myToken) });
              if (r.ok) { keepSuggestion(await r.json().catch(() => null)); location.href = "/app?shared=" + encodeURIComponent(TOKEN); return; }
              const e = await r.json().catch(() => ({})); btn.disabled = false;
              // Lien qui a servi à rédiger dans un autre navigateur : l'explication va dans le bandeau, pas sur le bouton.
              if (e && e.detail && e.detail.code === "espace_a_prouver") { const sm = b.querySelector(".small"); if (sm) sm.textContent = e.detail.message; btn.textContent = "Ouvrir dans mon Adjugo"; return; }
              btn.textContent = errText(e, "Impossible");
            } catch (e) { btn.disabled = false; btn.textContent = "Erreur"; }
          };
          if (!d.apercu_minimal) b.appendChild(btn);
        }
        nav("monao", "Le marché");
        icons();
      })
      .catch(e => fail(e.t || "Accès impossible", e.m || "Réessayez plus tard.", e.icon));
  </script>
</body>
</html>
